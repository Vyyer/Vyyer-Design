<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vyyer — Branding Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shell.css">
<!-- the stored dashboard theme is applied before paint, so the page never flashes the other one -->
<script>try{document.documentElement.dataset.theme=localStorage.getItem('vyyer.dashTheme')||'dark'}catch(e){}</script>
<!--
  ============================================================================
  VYYER DASHBOARD — SETTINGS ▸ BRANDING  (concept)

  THE MODEL, in four rules:

  1. ONE MODE. There is no preview/edit toggle. Clicking an element always
     selects it. The widget is never "operated" in here — every screen (and
     every per-document variant of it) is a row in the rail, reachable by the
     arrows too. Screen STATES (checked, open, error) are chips on the canvas
     toolbar. So a click never has two possible meanings.

     Desktop is a SEPARATE FLOW, not a breakpoint: QR / email hand-off, then the
     modal updates with progress and the verdict. There is no Mobile/Desktop
     switcher — screens render in their own frame. Add the switcher only when
     "Enable desktop scanning" ships and the mobile flow can run on desktop.

  2. SELECTION DRIVES THE PANEL. Nothing selected → brand-wide settings.
     Something selected → only that element's properties. The client never
     sees 300 fields; they see the six that belong to what they clicked.

  3. INHERITANCE IS VISIBLE. Every property shows where its value comes from:
     Global (inherited) or Custom (overridden here). Overriding is deliberate,
     and one click puts it back.

  4. EDIT ONE, APPLY TO THE SET. Walkthrough/Tips/Not-detected/Verdict screens
     repeat per document type. Any change offers "apply to all N" so clients
     style a set once instead of four or six times.
  THE SHELL: the dashboard nav is part of this page — logo, section tabs and the
  account cluster on one row. BRANDING IS A TOP-LEVEL TAB now (it used to sit
  inside Settings). The light/dark switch beside the account button themes the
  DASHBOARD; the widget's own light/dark values are a client setting and stay in
  the inspector, so a client on a dark widget still previews a dark widget.
  ============================================================================
-->
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#0a0a0b; --panel:#121214; --panel-2:#17171a; --sunken:#0e0e10;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16);
  --ink:rgba(255,255,255,.95); --ink-2:rgba(255,255,255,.56); --ink-3:rgba(255,255,255,.36);
  --accent:#A0D959; --accent-ink:#16240a; --accent-text:#A0D959;
  --tint:rgba(160,217,89,.12); --tint-2:rgba(160,217,89,.18);
  --hover:rgba(255,255,255,.05); --chip:rgba(255,255,255,.07);
  --field:#0e0e10;
  /* checkerboard, so a colour with opacity reads as transparent and not as grey */
  --checker:linear-gradient(45deg,rgba(130,130,130,.6) 25%,transparent 25%,transparent 75%,rgba(130,130,130,.6) 75%),
            linear-gradient(45deg,rgba(130,130,130,.6) 25%,transparent 25%,transparent 75%,rgba(130,130,130,.6) 75%);
  --checker-size:10px 10px; --checker-pos:0 0, 5px 5px;
  --warn:#E5A33C; --danger:#F26B5B;
  --shadow-pop:0 18px 44px -14px rgba(0,0,0,.85);
  --shadow-seg:0 1px 2px rgba(0,0,0,.4);
  --caret-img:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");
  --bar-h:52px;
  --r:10px; --font:'Inter',system-ui,sans-serif;
}
/* ---- DASHBOARD LIGHT MODE ----------------------------------------------
   Only the dashboard chrome flips. The device preview keeps rendering the
   CLIENT's widget theme, which is their setting, not the operator's: a client
   on a dark widget must still see a dark widget while working in light mode. */
[data-theme="light"]{
  --bg:#eff1f5; --panel:#ffffff; --panel-2:#f6f7f9; --sunken:#e9ecf1;
  --line:rgba(17,20,24,.10); --line-2:rgba(17,20,24,.18);
  --ink:#14171c; --ink-2:rgba(20,23,28,.66); --ink-3:rgba(20,23,28,.46);
  --accent-text:#4C7A15;
  --tint:rgba(109,165,41,.14); --tint-2:rgba(109,165,41,.2);
  --hover:rgba(17,20,24,.05); --chip:rgba(17,20,24,.06);
  --field:#F7F8F9;
  --danger:#D4503C;
  --shadow-pop:0 18px 44px -16px rgba(17,20,24,.26);
  --shadow-seg:0 1px 2px rgba(17,20,24,.12);
  --caret-img:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2314171c' stroke-width='2.4' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");
}
body{font-family:var(--font);background:var(--bg);color:var(--ink);height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}

/* ---------- shell ---------- */
.top{height:var(--bar-h);display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.top .crumb{font-size:13px;color:var(--ink-3)}
.top .crumb b{color:var(--ink);font-weight:600}
.top .sp{flex:1}
.btn{font:600 12.5px var(--font);border:1px solid var(--line-2);background:transparent;color:var(--ink);
  padding:7px 13px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:disabled{opacity:.4;cursor:not-allowed}
.btn svg{width:14px;height:14px}
.count{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);
  font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}

.app{display:grid;grid-template-columns:252px 1fr 324px;height:calc(100vh - var(--sh-h) - var(--bar-h))}

/* ---------- rail ---------- */
.rail{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:10px}
.rail h4{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:12px 8px 6px}
.brandbtn{width:100%;display:flex;align-items:center;gap:10px;padding:11px 10px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--panel-2);color:var(--ink);cursor:pointer;text-align:left;font:600 13px var(--font)}
.brandbtn:hover{border-color:var(--line-2)}
.brandbtn.on{border-color:var(--accent);background:var(--tint)}
.brandbtn .sub{display:block;font-size:11px;font-weight:400;color:var(--ink-3);margin-top:2px}
.brandbtn .ic{width:28px;height:28px;border-radius:8px;background:var(--tint-2);color:var(--accent-text);
  display:grid;place-items:center;flex:0 0 auto}
.brandbtn .ic svg{width:15px;height:15px}

.grp{margin-bottom:2px}
.grp>button{width:100%;display:flex;align-items:center;gap:8px;padding:8px 8px;border:0;background:transparent;
  color:var(--ink-2);font:600 12px var(--font);cursor:pointer;border-radius:8px}
.grp>button:hover{background:var(--hover);color:var(--ink)}
.grp>button .chev{width:12px;height:12px;transition:transform .15s;opacity:.6}
.grp.open>button .chev{transform:rotate(90deg)}
.grp .items{display:none;padding-left:6px}
.grp.open .items{display:block}
.screenbtn{width:100%;display:flex;align-items:center;gap:8px;padding:7px 9px;border:0;border-radius:8px;
  background:transparent;color:var(--ink-2);font:500 12.5px var(--font);cursor:pointer;text-align:left}
.screenbtn:hover{background:var(--hover);color:var(--ink)}
.screenbtn.on{background:var(--tint);color:var(--ink)}
.screenbtn .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:0 0 auto}
.screenbtn.off .nm{opacity:.5;text-decoration:line-through;text-decoration-thickness:1px}
.skip{font:700 9px var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--warn);
  background:rgba(229,163,60,.16);padding:2px 5px;border-radius:4px;flex:0 0 auto}

/* ---------- canvas ---------- */
.canvas{display:flex;flex-direction:column;background:var(--sunken);min-width:0}
.cbar{height:46px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line)}
.cbar .nm{font-size:13px;font-weight:600}
.cbar .sp{flex:1}
.segcap{font:600 10.5px var(--font);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-left:6px}
.seg{display:inline-flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;color:var(--ink-3);font:600 11.5px var(--font);
  padding:5px 10px;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--panel-2);color:var(--ink);box-shadow:var(--shadow-seg)}
.seg svg{width:13px;height:13px}
.nav{width:34px;height:34px;flex:0 0 auto;border-radius:9px;border:1px solid var(--line);background:var(--panel);
  color:var(--ink-2);cursor:pointer;font-size:18px;line-height:1}
.nav:hover{color:var(--ink);border-color:var(--line-2)}

.stage{flex:1;display:flex;align-items:center;justify-content:center;gap:14px;overflow:auto;padding:22px;position:relative}
.hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:11.5px;color:var(--ink-3);
  background:var(--panel);border:1px solid var(--line);padding:6px 12px;border-radius:99px;pointer-events:none}

/* device frames — rendered at true device size, then scaled to fit the stage,
   so every value in the inspector is a real device value */
.fitwrap{position:relative;display:flex;align-items:center;justify-content:center;flex:0 0 auto;overflow:visible}
.fitwrap>.frame{transform:scale(var(--fit,1));transform-origin:center center;flex:0 0 auto}
.frame{position:relative;background:#000;overflow:hidden;box-shadow:0 30px 70px -30px rgba(0,0,0,.9)}
.frame.mobile{width:390px;height:844px;border-radius:38px;border:10px solid #0e0e10}
.frame.desktop{width:620px;height:470px;border-radius:14px;border:1px solid var(--line)}
/* background selection outlines the whole device, like any other element */
.frame.selbg{box-shadow:0 0 0 2px var(--accent),0 0 0 6px rgba(160,217,89,.18),0 30px 70px -30px rgba(0,0,0,.9)}
.bgtag{position:absolute;top:-12px;right:0;background:var(--accent);color:var(--accent-ink);
  font:700 10px var(--font);padding:3px 7px;border-radius:5px;pointer-events:none;z-index:6}
.screen{width:100%;height:100%;overflow:hidden;position:relative;display:flex;flex-direction:column}

/* selectable elements */
[data-el]{position:relative;cursor:pointer}
[data-el]::after{content:'';position:absolute;inset:-5px;border:1.5px solid transparent;border-radius:7px;pointer-events:none;transition:border-color .12s}
[data-el]:hover::after{border-color:rgba(160,217,89,.55)}
/* The screen clips its contents to the device corners, so a selection outline drawn
   inside it gets cut off at the edges. Draw it in the wrapper instead, above the frame. */
.selbox{position:absolute;z-index:7;border:1.5px solid var(--accent);border-radius:7px;
  box-shadow:0 0 0 3px rgba(160,217,89,.18);pointer-events:none}
.selbox .tagline{top:-19px;left:-1.5px}
.screen::after{display:none}   /* the background draws its outline on the frame instead */
.tagline{position:absolute;top:-21px;left:-5px;background:var(--accent);color:var(--accent-ink);
  font:700 10px var(--font);padding:2px 6px;border-radius:5px;white-space:nowrap;pointer-events:none;z-index:5}

/* ---------- inspector ---------- */
.insp{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;overflow-x:hidden}
.insp .hd{padding:14px 16px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.insp .hd .k{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-text)}
.hdtop{display:flex;align-items:center;gap:8px}
.hdtop .sp{flex:1}
.insp .hd h3{font-size:15px;font-weight:600;margin-top:3px}
.insp .hd p{font-size:11.5px;color:var(--ink-3);margin-top:3px;line-height:1.45}
.sec{padding:12px 16px;border-bottom:1px solid var(--line)}
.sec>h5{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}

.row{margin-bottom:12px}
/* a colour that a custom image has taken over still shows its value, but
   reads as inactive rather than looking like a setting that does nothing */
.row.dim{opacity:.42}
.row.dim .ctl,.row.dim .picker{pointer-events:none}
.row:last-child{margin-bottom:0}
.row .lbl{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.row .lbl span{font-size:12px;color:var(--ink-2);flex:1}
.src{font:600 9.5px var(--font);letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:4px;
  background:var(--chip);color:var(--ink-3);cursor:default}
.src.custom{background:rgba(229,163,60,.18);color:var(--warn)}
.reset{border:0;background:transparent;color:var(--ink-3);cursor:pointer;padding:2px;display:grid;place-items:center}
.reset:hover{color:var(--accent-text)}
.reset svg{width:12px;height:12px}

.ctl{display:flex;align-items:center;gap:8px}
input[type=text],textarea,select{width:100%;background:var(--field);border:1px solid var(--line);color:var(--ink);
  font:400 12.5px var(--font);padding:8px 10px;border-radius:8px}
textarea{resize:vertical;min-height:112px;max-height:300px;line-height:1.5}
input[type=text]:focus,textarea:focus,select:focus{outline:0;border-color:var(--accent)}
select{appearance:none;background-image:var(--caret-img);
  background-repeat:no-repeat;background-position:right 9px center;background-size:12px;padding-right:28px;cursor:pointer}
.swatch{width:30px;height:30px;border-radius:7px;border:1px solid var(--line-2);flex:0 0 auto;cursor:pointer;padding:0;overflow:hidden}
.swatch input{opacity:0;width:100%;height:100%;cursor:pointer;border:0}
.hex{flex:1;font-family:ui-monospace,Menlo,monospace!important;text-transform:uppercase}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--field)}
.stepper button{border:0;background:transparent;color:var(--ink-2);width:26px;height:30px;cursor:pointer;font-size:14px}
.stepper button:hover{color:var(--ink);background:var(--hover)}
.stepper .v{min-width:44px;text-align:center;font-size:12.5px}

.applyall{width:100%;margin-top:4px;border:1px dashed var(--line-2);background:transparent;color:var(--ink-2);
  font:600 11.5px var(--font);padding:8px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.applyall:hover{border-color:var(--accent);color:var(--accent-text)}
.applyall svg{width:12px;height:12px}

.empty{padding:26px 16px;text-align:center;color:var(--ink-3);font-size:12px;line-height:1.6}
.empty svg{width:26px;height:26px;margin-bottom:8px;opacity:.5}

/* slider + typable number — no step-clicking */
.sliderrow{display:flex;align-items:center;gap:9px}
.sliderrow input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:3px;border-radius:2px;
  background:var(--line-2);outline:0}
.sliderrow input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:var(--accent);cursor:pointer;border:0}
.sliderrow input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--accent);cursor:pointer;border:0}
.sliderrow input[type=range]{min-width:0}
.sliderrow .numbox{width:56px;flex:0 0 auto;padding:8px 4px;text-align:center;font-family:ui-monospace,Menlo,monospace!important}

/* on/off */
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;background:transparent;border:0;padding:0;
  -webkit-appearance:none;appearance:none}
.toggle .track{width:34px;height:20px;border-radius:99px;background:var(--line-2);position:relative;transition:background .15s}
.toggle .track i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.toggle.on .track{background:var(--accent)}
.toggle.on .track i{transform:translateX(14px)}
.toggle span{font-size:12px;color:var(--ink-2)}

/* mode badge on sections whose values differ per theme */
.modechip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--field);
  color:var(--ink-2);font:600 9.5px var(--font);letter-spacing:.04em;text-transform:uppercase;
  padding:3px 7px;border-radius:99px;cursor:pointer}
.modechip:hover{border-color:var(--accent);color:var(--accent-text)}
.modechip.sm{padding:1px 6px;font-size:9px;letter-spacing:.06em;flex:0 0 auto}
.modechip svg{width:10px;height:10px}
.sec>h5{display:flex;align-items:center;gap:8px}
.sec>h5 .sp{flex:1}
.shared{font:500 9.5px var(--font);letter-spacing:.02em;text-transform:none;color:var(--ink-3)}

/* file upload + recently-used picker */
.upload{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.thumb{padding:0;border:0;background:transparent;cursor:pointer;position:relative;line-height:0;border-radius:7px}
.thumbplain{display:inline-block;line-height:0}
.thumb::after{content:'';position:absolute;right:4px;bottom:4px;width:0;height:0;
  border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--ink-3)}
.thumb:hover::after{border-top-color:var(--accent)}
.upload{position:relative}
.recent{display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:20;min-width:180px;
  background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:10px;
  box-shadow:var(--shadow-pop)}
.upload.open .recent{display:block}
.rh{font:600 9.5px var(--font);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-bottom:7px}
.recent .row2{display:flex;gap:6px;flex-wrap:wrap}
.rthumb{width:52px;height:34px;padding:3px;border:1px solid var(--line);border-radius:6px;background:var(--field);cursor:pointer}
.rthumb:hover{border-color:var(--accent)}
/* custom colour picker — the native one can't carry a recents palette */
.cpop{position:fixed;z-index:60;width:218px;display:none;background:var(--panel-2);
  border:1px solid var(--line-2);border-radius:12px;padding:11px;box-shadow:var(--shadow-pop)}
.cpop.open{display:block}
.sv{position:relative;height:118px;border-radius:8px;cursor:crosshair;margin-bottom:11px}
.svdot{position:absolute;width:12px;height:12px;border-radius:50%;border:2px solid #fff;
  box-shadow:0 0 0 1px rgba(0,0,0,.6);transform:translate(-50%,-50%);pointer-events:none}
.hue{width:100%;-webkit-appearance:none;appearance:none;height:10px;border-radius:5px;outline:0;cursor:pointer;
  background:linear-gradient(to right,#f00 0%,#ff0 17%,#0f0 33%,#0ff 50%,#00f 67%,#f0f 83%,#f00 100%)}
.hue::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;border:1px solid rgba(0,0,0,.45);cursor:pointer}
.hue::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:#fff;border:1px solid rgba(0,0,0,.45);cursor:pointer}
.cprow{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.sliders{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.alpha{width:100%;-webkit-appearance:none;appearance:none;height:10px;border-radius:5px;outline:0;cursor:pointer;
  background-size:auto,var(--checker-size);background-position:0 0,var(--checker-pos)}
.alpha::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;border:1px solid rgba(0,0,0,.45);cursor:pointer}
.alpha::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:#fff;border:1px solid rgba(0,0,0,.45);cursor:pointer}
.eyed{width:26px;height:26px;flex:0 0 auto;border:0;background:transparent;color:var(--ink-2);cursor:pointer;display:grid;place-items:center;border-radius:6px}
.eyed:hover{color:var(--accent-text);background:var(--hover)}
.eyed svg{width:16px;height:16px}
.eyed[disabled]{opacity:.28;cursor:not-allowed}
.cpreview{width:28px;height:28px;flex:0 0 auto;border-radius:50%;border:1px solid var(--line-2);
  background-size:auto,var(--checker-size);background-position:0 0,var(--checker-pos)}
.frow{display:flex;align-items:flex-start;gap:6px}
.frow label{flex:1;display:block;text-align:center;min-width:0}
.frow input[type=text]{width:100%;text-align:center;padding:6px 2px;font-family:ui-monospace,Menlo,monospace!important;font-size:11.5px}
.frow label span{display:block;font-size:9.5px;color:var(--ink-3);margin-top:4px;letter-spacing:.04em}
.fmt{width:18px;height:30px;flex:0 0 auto;border:0;background:transparent;color:var(--ink-3);cursor:pointer;display:grid;place-items:center}
.fmt:hover{color:var(--ink)}
.fmt svg{width:12px;height:12px}
.cpop .rh{margin:12px 0 6px}
.swatches{display:flex;gap:5px;flex-wrap:wrap}
.cchip{width:21px;height:21px;border-radius:5px;border:1px solid var(--line-2);cursor:pointer;padding:0}
.cchip:hover{border-color:var(--accent)}
.recent .rthumb img{width:100%;height:100%;padding:0;border:0;border-radius:0;object-fit:contain;display:block}
.recent .none{font-size:11px;color:var(--ink-3)}
.upload img{width:66px;height:38px;object-fit:contain;background:var(--field);border:1px solid var(--line);border-radius:7px;padding:4px}
.upload .ph{width:66px;height:38px;display:grid;place-items:center;border:1px dashed var(--line-2);border-radius:7px;color:var(--ink-3);font-size:9px}
.upload label.btn{cursor:pointer}

/* custom dropdown — a native select popup can't be styled, can't show a font
   in its own face, and doesn't match anything else in here */
.dd{position:relative}
.dd>button{width:100%;display:flex;align-items:center;gap:8px;background:var(--field);border:1px solid var(--line);
  color:var(--ink);font:400 12.5px var(--font);padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left}
.dd>button:hover{border-color:var(--line-2)}
.dd.open>button{border-color:var(--accent)}
.dd .v{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd .cv{width:12px;height:12px;flex:0 0 auto;opacity:.55;transition:transform .15s}
.dd.open .cv{transform:rotate(180deg)}
.ddm{display:none;position:absolute;top:calc(100% + 5px);left:0;right:0;z-index:30;padding:5px;
  max-height:252px;overflow-y:auto;background:var(--panel-2);border:1px solid var(--line-2);
  border-radius:10px;box-shadow:var(--shadow-pop)}
.dd.open .ddm{display:block}
.ddrow{display:flex;align-items:center;border-radius:7px}
.ddrow:hover{background:var(--hover)}
.ddrow.on{background:var(--tint)}
.ddpick{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--ink-2);
  font:400 12.5px var(--font);padding:7px 8px;border-radius:7px;cursor:pointer;text-align:left}
.ddrow:hover .ddpick,.ddrow.on .ddpick{color:var(--ink)}
.ddpick.up{color:var(--accent-text);font-weight:600}
.ddpick .mut{color:var(--ink-3);font-weight:400;font-size:11px;flex:0 0 auto}
.ddm .tk{width:12px;height:12px;flex:0 0 auto;opacity:0;color:var(--accent-text)}
.ddrow.on .tk{opacity:1}
/* a client manages their uploaded faces where they pick them — removing one
   anywhere removes it everywhere, so there is no second place to keep in sync */
.ddx{width:22px;height:22px;margin-right:5px;flex:0 0 auto;border:0;background:transparent;color:var(--ink-3);
  border-radius:5px;cursor:pointer;display:grid;place-items:center;opacity:0}
.ddrow:hover .ddx,.ddx:focus-visible{opacity:1}
.ddx:hover{color:var(--danger);background:var(--hover)}
.ddx svg{width:11px;height:11px}
.ddnote{font:500 11px var(--font);color:var(--ink-3);padding:7px 9px 5px;line-height:1.45}
.ddm .sep{height:1px;background:var(--line);margin:5px 2px}

/* custom typefaces — Inter is always there, the client may add three */
/* alignment + bullet style pickers */
.picker{display:flex;gap:5px}
.picker button{flex:1;border:1px solid var(--line);background:var(--field);color:var(--ink-2);
  border-radius:8px;padding:7px 0;cursor:pointer;display:grid;place-items:center;font:600 13px var(--font)}
.picker button:hover{border-color:var(--line-2);color:var(--ink)}
.picker button.on{border-color:var(--accent);background:var(--tint);color:var(--ink)}
.picker svg{width:15px;height:15px}

/* list editor — the bullets are shown in the gutter so they read as a list */
.listfield{position:relative}
.listfield .gutter{position:absolute;top:9px;left:11px;width:18px;pointer-events:none;
  color:var(--ink-3);font:400 12.5px/1.5 var(--font);white-space:pre;text-align:center}
.listfield textarea{padding-left:30px;white-space:pre;overflow-x:auto}

/* background style picker */
.bgstyles{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.bgstyles button{border:1px solid var(--line);background:var(--field);color:var(--ink-2);
  font:600 11px var(--font);padding:9px 6px;border-radius:8px;cursor:pointer}
.bgstyles button:hover{border-color:var(--line-2);color:var(--ink)}
.bgstyles button.on{border-color:var(--accent);background:var(--tint);color:var(--ink)}
.note{font-size:10.5px;color:var(--ink-3);line-height:1.45;margin-top:7px;display:flex;gap:6px}
.note svg{width:12px;height:12px;flex:0 0 auto;margin-top:1px}

/* capture sweep — each dash turns to the capture colour in turn */
@keyframes dashOn{to{fill:var(--cap)}}
.sweep{animation:dashOn .34s ease forwards;animation-delay:calc(var(--i) * 0.022s)}

/* logo-blur bokeh layer */
.bokeh{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:0}
.screen>*:not(.bokeh){position:relative;z-index:1}

@media (max-width:1100px){ .app{grid-template-columns:200px 1fr 292px} }
</style>
</head>

<script src="shell.js"></script>
<script>
/* ============================================================================
   1. BRAND TOKENS
      `modal:true` means the token holds TWO values — one per theme mode.
      Fonts and radii are deliberately shared: a client's typeface doesn't
      change between light and dark, but every colour and logo does.
   ============================================================================ */
const TOKENS = {
  theme:         {label:'Color theme',      type:'select',  group:'Identity',   value:'Dark', options:['Light','Dark','Dynamic']},
  company:       {label:'Company name',     type:'text',    group:'Identity',   value:'',
                  placeholder:'e.g. Stewart', note:'Fills in {Company} wherever it appears.'},
  logo:          {label:'Company logo',     type:'logo',    group:'Identity',   modal:true, values:{light:'',dark:''}},

  bgStyle:       {label:'Background style', type:'bgstyle', group:'Background', modal:true, values:{light:'Solid',dark:'Solid'}},
  pageBg:        {label:'Background color', type:'color',   group:'Background', modal:true, values:{light:'#FFFFFF',dark:'#1E1E1E'}},
  pageBg2:       {label:'Gradient end',     type:'color',   group:'Background', modal:true, values:{light:'#E9E4F5',dark:'#0B0B0C'}},
  pageImg:       {label:'Background image', type:'upload',  group:'Background', modal:true, values:{light:'',dark:''}},

  primaryText:   {label:'Primary text',     type:'color',   group:'Colors',     modal:true, values:{light:'#111111',dark:'#FFFFFF'}},
  secondaryText: {label:'Secondary text',   type:'color',   group:'Colors',     modal:true, values:{light:'#656565',dark:'#A4A4A4'}},
  accent:        {label:'Accent',           type:'color',   group:'Colors',     modal:true, values:{light:'#3E7A2E',dark:'#A0D959'}},

  buttonBg:      {label:'Button fill',      type:'color',   group:'Buttons',    modal:true, values:{light:'#111111',dark:'#FFFFFF'}},
  buttonText:    {label:'Button text',      type:'color',   group:'Buttons',    modal:true, values:{light:'#FFFFFF',dark:'#111111'}},
  buttonRadius:  {label:'Corner radius',    type:'radius',  group:'Buttons',    value:10},

  cardBg:        {label:'Card fill',        type:'color',   group:'Cards',      modal:true, values:{light:'#F4F5F7',dark:'#2A2A2D'}},
  cardBorder:    {label:'Card border',      type:'color',   group:'Cards',      modal:true, values:{light:'#E3E5E9',dark:'#3A3A3D'}},
  cardRadius:    {label:'Corner radius',    type:'radius',  group:'Cards',      value:12},

  hideClose:     {label:'Hide close icon',  type:'toggle',  group:'Navigation', value:false,
                  note:'Used in mobile applications where you use your own navigation.'},

  requireConsent:{label:'Show consent screen', type:'toggle', group:'Consent', value:true,
                  note:'Strongly advised. We recommend collecting this consent before you verify a '
                     + 'customer\u2019s identity. It can be switched off, and verification will then start '
                     + 'straight after the start screen.'},

  fontTitle:     {label:'Title font',       type:'font',    group:'Typefaces',  value:'Inter'},
  fontHeader:    {label:'Header font',      type:'font',    group:'Typefaces',  value:'Inter'},
  fontBody:      {label:'Body font',        type:'font',    group:'Typefaces',  value:'Inter'},
};
const GROUP_ORDER=['Identity','Background','Colors','Buttons','Cards','Typefaces','Navigation','Consent'];

/* which mode are we previewing and editing? */
let mode='dark';
function activeMode(){
  const t=TOKENS.theme.value;
  return t==='Dynamic' ? mode : (t==='Light'?'light':'dark');
}
const tok = k => TOKENS[k].modal ? TOKENS[k].values[activeMode()] : TOKENS[k].value;

/* ============================================================================
   2. SCREENS
   ============================================================================ */
/* role defaults: a title is 600 in the title face, body copy is 400 in the body face */
const T = (text,sz)=>({text:{value:text}, align:{value:'Center'}, color:{bind:'primaryText'}, font:{bind:'fontTitle'}, size:{value:sz||20}, weight:{value:600}});
const S = (text,sz)=>({text:{value:text}, align:{value:'Center'}, color:{bind:'secondaryText'}, font:{bind:'fontBody'}, size:{value:sz||15}, weight:{value:400}});
/* a bulleted block: content sets its own width, text inside is left aligned,
   and the block is centred in the screen — the way the live widget does it */
const L = (text,sz)=>({text:{value:text}, bullet:{value:'Disc'}, align:{value:'Center'},
  color:{bind:'secondaryText'}, font:{bind:'fontBody'}, size:{value:sz||14}, weight:{value:400}});
const BTN = (label)=>({label:{value:label}, bg:{bind:'buttonBg'}, fg:{bind:'buttonText'}, radius:{bind:'buttonRadius'}, weight:{value:700}});

const SCREENS = [
 {id:'start', group:'Start', name:'Start screen', els:{
    logo:   {label:'Logo',        type:'logo',  props:{align:{value:'Center'}, src:{bind:'logo'}, scale:{value:1}}},
    title:  {label:'Title',       type:'text',  props:T('Please verify your identity to continue')},
    sub:    {label:'Subtitle',    type:'texticon',props:Object.assign(S('Time to verify: Instant'),
              {show:{value:true}, iconShow:{value:true}, iconColor:{bind:'secondaryText'}, iconCustom:{value:''}})},
    cards:  {label:'Info cards',  type:'card',  props:{bg:{bind:'cardBg'}, border:{bind:'cardBorder'}, radius:{bind:'cardRadius'}, count:{value:3}}},
    i1:     {label:'Step 1 icon', type:'stepicon',props:{bg:{bind:'accent'}, fg:{bind:'pageBg'}, custom:{value:''}}},
    i2:     {label:'Step 2 icon', type:'stepicon',props:{bg:{bind:'accent'}, fg:{bind:'pageBg'}, custom:{value:''}}},
    i3:     {label:'Step 3 icon', type:'stepicon',props:{bg:{bind:'accent'}, fg:{bind:'pageBg'}, custom:{value:''}}},
    c1:     {label:'Step 1 text', type:'step',  props:{title:{value:'Step 1'}, desc:{value:'Choose an ID document to verify'}, titleWeight:{value:600}, descWeight:{value:400}}},
    c2:     {label:'Step 2 text', type:'step',  props:{title:{value:'Step 2'}, desc:{value:'Scan your face'}, titleWeight:{value:600}, descWeight:{value:400}}},
    c3:     {label:'Step 3 text', type:'step',  props:{title:{value:'Step 3'}, desc:{value:'Scan your document'}, titleWeight:{value:600}, descWeight:{value:400}}},
    btn:    {label:'Start button',type:'button',props:BTN('Start')},
    terms:  {label:'Terms & privacy',type:'links',props:{
              aLabel:{value:'Terms'},   aUrl:{value:'https://example.com/terms'},
              bLabel:{value:'Privacy'}, bUrl:{value:'https://example.com/privacy'},
              align:{value:'Center'}, color:{bind:'secondaryText'}, font:{bind:'fontBody'},
              size:{value:14}, weight:{value:400}, underline:{value:true}}},
 }},
 {id:'choose', group:'Start', name:'Choose document', els:{
    title:  {label:'Title',       type:'text',  props:T('Choose Document Type')},
    sub:    {label:'Description', type:'text',  props:S('Select your issuing country and document type')},
    country:{label:'Country row', type:'card',  props:{bg:{bind:'cardBg'}, border:{bind:'cardBorder'}, radius:{bind:'cardRadius'}}},
    optTitle:{label:'“Verify using” label',type:'text',props:{text:{value:'Verify using'}, align:{value:'Left'}, color:{bind:'primaryText'}, font:{bind:'fontBody'}, size:{value:14}, weight:{value:600}}},
    opts:   {label:'Document options',type:'card',props:{bg:{bind:'cardBg'}, border:{bind:'cardBorder'}, radius:{bind:'cardRadius'}}},
    check:  {label:'Selected check',type:'icon',props:{color:{bind:'accent'}, custom:{value:''}}},
    btn:    {label:'Next button', type:'button',props:BTN('Next')},
 }},
 {id:'country', group:'Start', name:'Choose country', els:{
    back:   {label:'Back icon',   type:'icon',   props:{color:{bind:'primaryText'}, custom:{value:''}}},
    search: {label:'Search field',type:'search', props:{placeholder:{value:'Type country name...'},
              bg:{bind:'cardBg'}, color:{bind:'secondaryText'}, radius:{bind:'cardRadius'}}},
    searchIcon:{label:'Search icon',type:'icon', props:{color:{bind:'secondaryText'}, custom:{value:''}}},
    clist:  {label:'Country list',type:'countrylist',props:{color:{bind:'primaryText'}, font:{bind:'fontBody'}, size:{value:15}, weight:{value:400}}},
    check:  {label:'Selected check',type:'icon',  props:{color:{bind:'accent'}, custom:{value:''}}},
 }},
 /* The consent gate is a POPOVER over the start screen, not a screen of its
    own — same as the handoff files in vyyer-consent-{light,dark}.html. */
 {id:'consent', group:'Start', name:'Consent gate', els:{
    sheet:  {label:'Popover surface',type:'card',props:{bg:{bind:'pageBg'}, border:{bind:'cardBorder'}, radius:{value:18}}},
    close:  {label:'Close icon',  type:'icon',  props:{color:{bind:'secondaryText'}, custom:{value:''}}},
    logo:   {label:'Logo',        type:'logo',  props:{align:{value:'Center'}, src:{bind:'logo'}, scale:{value:.8}}},
    title:  {label:'Title',       type:'text',  props:Object.assign(T('{Company} is requesting access to',18), {weight:{value:700}})},
    list:   {label:'Collection list',type:'fixedlist',props:Object.assign(L('A live face scan\nBiometric data from your ID photo\nA scan of your ID document\nYour name, DOB, address and ID number'), {align:{value:'Left'}, color:{bind:'primaryText'}})},
    note:   {label:'Purpose & retention',type:'text',props:{text:{value:'Vyyer LLC, {Company}’s data processor, collects this only to verify your identity, and deletes face scans within 3 months.'}, align:{value:'Left'}, color:{bind:'primaryText'}, font:{bind:'fontBody'}, size:{value:14}, weight:{value:400}}},
    learn:  {label:'“Learn more” link',type:'text',props:{text:{value:'Learn more'}, align:{value:'Left'}, color:{bind:'primaryText'}, font:{bind:'fontBody'}, size:{value:14}, weight:{value:600}}},
    release:{label:'Consent checkbox',type:'consentbox',props:{
              text:{value:'I consent to {Company} and Vyyer LLC collecting and storing a scan of my face and ID data.'},
              color:{bind:'primaryText'}, font:{bind:'fontBody'}, size:{value:14}, weight:{value:600},
              boxColor:{bind:'cardBorder'}, checkedFill:{bind:'accent'}, checkedTick:{bind:'pageBg'},
              bg:{bind:'cardBg'}, border:{bind:'cardBorder'}, radius:{value:10}}},
    btn:    {label:'Agree button',type:'button',props:BTN('Agree and continue')},
    decline:{label:'Decline link',type:'text',  props:{text:{value:'I don’t consent'}, align:{value:'Center'}, color:{bind:'secondaryText'}, font:{bind:'fontBody'}, size:{value:13}, weight:{value:600}}},
 }},
 {id:'walk', group:'Walkthrough', name:'Walkthrough', variants:['Face','ID front','ID back','Passport'], els:{
    img:    {label:'Illustration',type:'image', props:{custom:{value:''}, scale:{value:1}}},
    title:  {label:'Title',       type:'text',  props:T('Get ready to scan your face')},
    desc:   {label:'Description', type:'text',  props:S('Make sure you’re in a well lit room. Avoid any bright lights behind you.')},
    btn:    {label:'Button',      type:'button',props:BTN('Let’s go')},
 }},
 {id:'scan', group:'Scanning', name:'Scanning', variants:['Face','ID front','ID back','Passport'], els:{
    navbar: {label:'Navigation bar',type:'navbar', props:{
              logoShow:{value:true}, logoSrc:{bind:'logo'}, logoScale:{value:.8},
              helpShow:{value:true}, helpColor:{bind:'primaryText'}, helpCustom:{value:''},
              closeColor:{bind:'primaryText'}, closeCustom:{value:''}}},
    guide:  {label:'Camera guide',type:'guide', props:{color:{value:'#B1B1B1'}, successColor:{value:'#5FC52E'}, width:{value:3}}},
    status: {label:'Status message',type:'status',props:{
              text:{value:'Center your face in the frame'},
              bg:{value:'#3A3A3AE6'}, color:{value:'#FFFFFF'},
              errorBg:{value:'#F4524D'},  errorColor:{value:'#FFFFFF'},
              successBg:{value:'#3CBF68'},successColor:{value:'#FFFFFF'}}},
 }},
 {id:'tips', group:'Tips', name:'Scanning tips', variants:['Face','ID front','ID back','Passport'], els:{
    img:    {label:'Illustration',type:'image', props:{custom:{value:''}, scale:{value:1}}},
    title:  {label:'Title',       type:'text',  props:T('Face Scanning Tips')},
    bullets:{label:'Bullets',     type:'list',  props:L('Scan in a well lit room\nPosition your face in the oval\nMake sure your face is fully visible\nAvoid bright lights behind you')},
    btn:    {label:'Button',      type:'button',props:BTN('Scan my Face')},
 }},
 {id:'nodetect', group:'Not detected', name:'Not detected', variants:['Face','ID front','ID back','Passport'], els:{
    img:    {label:'Illustration',type:'image', props:{custom:{value:''}, scale:{value:1}}},
    title:  {label:'Title',       type:'text',  props:T('Face Not Detected')},
    bullets:{label:'Bullets',     type:'list',  props:L('Position your face in the oval\nMake sure your face is fully visible\nAvoid dark lighting\nAvoid bright lights behind you')},
    btn:    {label:'Button',      type:'button',props:BTN('Retry')},
 }},
 {id:'verdict', group:'Verdicts', name:'Verdict', variants:['Verified','Failed','Underage','Expired','In review','Max attempts'], els:{
    icon:   {label:'Verdict icon',type:'icon',  props:{color:{bind:'accent'}, shape:{value:'check'}, custom:{value:''}}},
    title:  {label:'Title',       type:'text',  props:T('Thank You!')},
    desc:   {label:'Description', type:'text',  props:S('Your identity was successfully verified.')},
    btn:    {label:'Button',      type:'button',props:BTN('Done')},
 }},
 {id:'qr', group:'Desktop hand-off', name:'QR code', device:'desktop', els:{
    logo:   {label:'Logo',        type:'logo',  props:{src:{bind:'logo'}, scale:{value:.8}}},
    title:  {label:'Title',       type:'text',  props:T('Scan the QR Code to continue verifying on your mobile device')},
    qr:     {label:'QR frame',    type:'card',  props:{bg:{value:'#FFFFFF'}, border:{bind:'cardBorder'}, radius:{bind:'cardRadius'}}},
    link:   {label:'Email link',  type:'text',  props:{text:{value:'Email me a link instead'}, color:{bind:'accent'}, font:{bind:'fontBody'}, size:{value:14}, weight:{value:500}}},
 }},
];

/* The background is an element like any other — so a client can give the
   Verified screen a green wash and Failed a red one without touching globals. */
SCREENS.forEach(s=> s.els.__bg = {label:'Background', type:'bg', props:{
  style:{bind:'bgStyle'}, color:{bind:'pageBg'}, color2:{bind:'pageBg2'}, image:{bind:'pageImg'}
}});

const VARIANT_COPY = {
  walk:{'Face':['Get ready to scan your face','Make sure you’re in a well lit room. Avoid any bright lights behind you.','Let’s go'],
        'ID front':['Scan the front of your ID','Keep the document well lit. All document fields should be visible.','Let’s go'],
        'ID back':['Scan the back of your ID','Keep the document well lit. The barcode should be crisp and clear.','Let’s go'],
        'Passport':['Scan the passport photo page','Keep the document well lit. All document fields should be visible.','Let’s go']},
  tips:{'Face':['Face Scanning Tips','Scan in a well lit room\nPosition your face in the oval\nMake sure your face is fully visible\nAvoid bright lights behind you','Scan my Face'],
        'ID front':['ID Scanning Tips','Avoid dark lighting\nText should be clear and readable\nScan your ID in a well lit room\nDon’t cover text or photos','Scan my ID'],
        'ID back':['ID Scanning Tips','Avoid dark lighting\nAvoid any glare on the barcode\nBarcode should be crisp and clear\nDon’t cover text or barcode','Scan my ID'],
        'Passport':['Passport scanning tips','Scan in a well lit room\nAvoid any glare on the passport\nText should be clear and readable\nDon’t cover text or photos','Scan my Passport']},
  nodetect:{'Face':['Face Not Detected','Position your face in the oval\nMake sure your face is fully visible\nAvoid dark lighting\nAvoid bright lights behind you','Retry'],
        'ID front':['ID not detected','Scan your ID in a well lit room\nAvoid any glare on the ID\nText should be clear and readable\nDon’t cover text or photos','Retry'],
        'ID back':['ID not detected','Scan your ID in a well lit room\nAvoid any glare on the barcode\nBarcode should be crisp and clear\nDon’t cover text or barcode','Retry'],
        'Passport':['Passport not detected','Scan in a well lit room\nAvoid any glare on the passport\nText should be clear and readable\nDon’t cover text or photos','Retry']},
  scan:{'Face':['','Center your face in the frame',''],
        'ID front':['','Scan the front side of your ID',''],
        'ID back':['','Scan the back side of your ID',''],
        'Passport':['','Scan passport photo page','']},
  verdict:{'Verified':['Thank You!','Your identity was successfully verified.','Done','check','#4ADE80'],
        'Failed':['Verification Failed','We were unable to verify your identity, please try again.','Close','cross','#F87171'],
        'Underage':['Must be 18','Sorry, you must be at least 18 years old to use our services.','Retry','warn','#E5A33C'],
        'Expired':['Expired ID','Please try again using a currently valid ID document.','Retry','warn','#E5A33C'],
        'In review':['Thank You','Your data has been sent to us for review','Done','check','#4ADE80'],
        'Max attempts':['Max Attempts Reached','You have reached the max number of attempts for verification.','Close','cross','#F87171']},
};

const FLAT=[];
SCREENS.forEach(s=>{
  if(s.variants) s.variants.forEach((v,i)=> FLAT.push({id:s.id, v:i, label:v, group:s.group, screen:s.name}));
  else FLAT.push({id:s.id, v:0, label:s.name, group:s.group, screen:s.name});
});
const flatIndex = ()=> FLAT.findIndex(f=>f.id===state.screen && f.v===state.variant);

/* ============================================================================
   3. STATE + HISTORY
      Overrides are keyed screen|variant|element|prop|mode — mode is part of the
      key only for properties that resolve to a mode-dependent token.
   ============================================================================ */
let state = {screen:'start', variant:0, sel:null, panel:'brand'};
let overrides = {};
const isModal = (scrId, elId, prop)=>{
  const spec = SCREENS.find(s=>s.id===scrId).els[elId].props[prop];
  if(!spec) return false;
  return !!(spec.modal || (spec.bind && TOKENS[spec.bind].modal));
};
const key = (s,v,e,p)=> s+'|'+v+'|'+e+'|'+p + (isModal(s,e,p) ? '|'+activeMode() : '');

function resolve(scrId, variant, elId, prop){
  const scr = SCREENS.find(s=>s.id===scrId), el = scr.els[elId];
  if(!el) return {value:undefined, source:'default'};
  const spec = el.props[prop];
  const k = key(scrId, variant, elId, prop);
  if (k in overrides) return {value:overrides[k], source:'custom'};
  const vc = VARIANT_COPY[scrId];
  if (vc && scr.variants){
    const row = vc[scr.variants[variant]];
    if (row){
      if (prop==='text' && elId==='title')   return {value:row[0], source:'default'};
      if (prop==='text' && (elId==='desc'||elId==='bullets'||elId==='status')) return {value:row[1], source:'default'};
      if (prop==='label'&& elId==='btn')     return {value:row[2], source:'default'};
      if (prop==='shape'&& elId==='icon')    return {value:row[3], source:'default'};
      if (prop==='color'&& elId==='icon')    return {value:row[4], source:'default'};
    }
  }
  if (!spec) return {value:undefined, source:'default'};
  if (spec.bind) return {value:tok(spec.bind), source:'global', bind:spec.bind};
  return {value:spec.value, source:'default'};
}
const val = (e,p)=> resolve(state.screen, state.variant, e, p).value;
const curScreen = ()=> SCREENS.find(s=>s.id===state.screen);

/* history — every mutation is undoable */
let past=[], future=[];
function snapshot(){
  return JSON.stringify({
    t:Object.fromEntries(Object.entries(TOKENS).map(([k,v])=>[k, v.modal?{...v.values}:v.value])),
    o:{...overrides}, m:mode
  });
}
function restore(str){
  const d=JSON.parse(str);
  Object.entries(d.t).forEach(([k,v])=>{ if(TOKENS[k].modal) TOKENS[k].values={...v}; else TOKENS[k].value=v; });
  overrides={...d.o}; mode=d.m;
}
function mark(){ past.push(snapshot()); if(past.length>80) past.shift(); future=[]; }
function undo(){ if(!past.length) return; future.push(snapshot()); restore(past.pop()); touch(); }
function redo(){ if(!future.length) return; past.push(snapshot()); restore(future.pop()); touch(); }

function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
/* {Company} stays in the copy so the three consent lines keep one shared name
   — set it once, in whichever of them you happen to be editing. */
const attrEsc = v => esc(v==null?'':v).replace(/"/g,'&quot;');
const COMPANY_RE=/\{Company\}/g;
const hasCompany = v => /\{Company\}/.test(String(v==null?'':v));
function companify(s){
  const m=(TOKENS.company.value||'').trim();
  return String(s==null?'':s).replace(COMPANY_RE, m || '{Company}');
}

const BULLETS={None:'', Disc:'\u2022', Circle:'\u25E6', Square:'\u25AA', Triangle:'\u2023', Check:'\u2713', Dash:'\u2013'};
/* a hidden element stays on the canvas as a ghost, so it can be switched back on */
const ghostCss = el => (val(el,'show')===false)
  ? 'opacity:.25;outline:1px dashed currentColor;outline-offset:4px;' : '';

/* Alignment moves the BLOCK as well as the text — left-aligning a short line has to
   put it at the left margin, otherwise the setting looks like it does nothing.
   A list is the exception: its lines always align with each other, and the
   alignment setting positions the whole group. */
function alignBox(el, isList){
  const al=(val(el,'align')||'Center').toLowerCase();
  const m = al==='left'  ? 'margin-right:auto'
          : al==='right' ? 'margin-left:auto'
          :                'margin-left:auto;margin-right:auto';
  return isList
    ? `width:fit-content;max-width:100%;${m};text-align:left`
    : `width:100%;${m};text-align:${al}`;
}
function textBlock(el, inner, extra, isList){
  const c=val(el,'color'), f=val(el,'font'), s=val(el,'size'), w=val(el,'weight')||400;
  return `<div data-el="${el}" style="color:${c};font-family:${fontStack(f)};font-size:${s}px;font-weight:${w};line-height:1.45;
    ${alignBox(el,isList)};${ghostCss(el)}${extra||''}">${inner}</div>`;
}
function txt(el, extra){ return textBlock(el, esc(companify(val(el,'text'))).replace(/\n/g,'<br>'), extra, false); }
function list(el, extra){
  const g=BULLETS[val(el,'bullet')||'Disc'];
  const rows=String(companify(val(el,'text'))).split('\n').map(l=> g
    ? `<div style="display:flex;gap:9px;margin-bottom:6px"><span style="flex:0 0 auto">${g}</span><span>${esc(l)}</span></div>`
    : `<div style="margin-bottom:6px">${esc(l)}</div>`).join('');
  return textBlock(el, rows, extra, true);
}
/* text + icon are ONE selectable block: hide the icon and the text re-centres */
function textIcon(el, extra){
  const showIcon=val(el,'iconShow'), custom=val(el,'iconCustom'), ic=val(el,'iconColor'), s=val(el,'size');
  const sz=Math.round(s*1.1);
  const icon = !showIcon ? '' : (custom
    ? `<img src="${custom}" style="height:${sz}px;width:auto;object-fit:contain;display:block">`
    : `<svg viewBox="0 0 24 24" style="width:${sz}px;height:${sz}px;flex:0 0 auto" fill="none" stroke="${ic}" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2" stroke-linecap="round"/></svg>`);
  const al=(val(el,'align')||'Center').toLowerCase();
  const just = al==='left'?'flex-start':al==='right'?'flex-end':'center';
  return `<div data-el="${el}" style="display:flex;align-items:center;justify-content:${just};gap:7px;width:100%;
    color:${val(el,'color')};font-family:${fontStack(val(el,'font'))};font-size:${s}px;font-weight:${val(el,'weight')||400};
    ${ghostCss(el)}${extra||''}">${icon}<span>${esc(companify(val(el,'text')))}</span></div>`;
}
function button(el){
  const l=val(el,'label'), bg=val(el,'bg'), fg=val(el,'fg'), r=val(el,'radius'), w=val(el,'weight')||700;

    align-items:center;justify-content:center;font-family:${fontStack(tok('fontBody'))};font-size:17px;font-weight:${w};width:100%">${esc(l)}</div>`;

/* A logo is sized by HEIGHT and keeps its own aspect ratio — square, circular or
   a wide wordmark all just fit the box height. Scale is a MULTIPLIER (0.5–2),
   never a pixel size, because the widget is responsive. */
const LOGO_H = 21;   // 1x — matches the live widget's logo box
function logoMark(scale, color, custom, markOnly){
  const h = LOGO_H * (scale||1);
  if(custom) return `<img src="${custom}" style="height:${h}px;width:auto;max-width:100%;object-fit:contain;display:block">`;
  const roundel = `<circle cx="23" cy="23" r="23" fill="${tok('accent')}"/>
    <path d="M14 15l9 16 9-16" fill="none" stroke="${tok('pageBg')}" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  if(markOnly) return `<svg viewBox="0 0 46 46" style="height:${h}px;width:auto;display:block">${roundel}</svg>`;
  return `<svg viewBox="0 0 176 46" style="height:${h}px;width:auto;display:block">${roundel}
    <text x="56" y="34" font-family="Inter" font-size="30" font-weight="700" fill="${color}">vyyer</text></svg>`;
}

function linkRow(el, extra){

    <rect x="20" y="6" width="24" height="46" rx="4"/><circle cx="32" cy="26" r="6"/><path d="M24 44c2-5 5-7 8-7s6 2 8 7"/></svg>`;
}
/* one close icon for every screen, so the global switch has a single place to act */
function closeIcon(color, custom){
  /* keep the slot so hiding it doesn't pull the whole screen upward */
  if(tok('hideClose')) return `<span style="width:20px;height:20px;display:block;flex:0 0 auto"></span>`;
  if(custom) return `<img src="${custom}" style="width:20px;height:20px;object-fit:contain;display:block">`;
  return `<svg viewBox="0 0 24 24" style="width:20px;height:20px;display:block;flex:0 0 auto" fill="none" stroke="${color}"
    stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>`;
}
/* The production oval is a Lottie export with #b1b1b1 and #5fc52e baked in.
   Generating the ring instead makes both colours real settings — and the capture
   sweep is a CSS animation with a per-dash delay, same read as the original. */
function ovalRing(idle, capture, weight, sweeping){
  /* measured off the production screen: the oval is 78% of the screen width
     with a 0.80 width-to-height ratio — 306 x 383 inside a 390pt screen */
  const W=320, H=410, cx=W/2, cy=H/2, rx=153, ry=191, N=46;
  let d='';
  for(let i=0;i<N;i++){
    const a=(i/N)*Math.PI*2 - Math.PI/2;
    const x=cx+rx*Math.cos(a), y=cy+ry*Math.sin(a);
    d+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(weight*1.15).toFixed(1)}"
        style="--i:${i}" fill="${idle}"${sweeping?' class="sweep"':''}/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" style="width:${W}px;height:${H}px;display:block;--cap:${capture}">${d}</svg>`;
}
function checkMark(){

    stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>`;
}

function backgroundCss(){
  const st=val('__bg','style'), c=val('__bg','color'), c2=val('__bg','color2'), img=val('__bg','image');
  if(st==='Gradient') return `background:linear-gradient(160deg, ${c} 0%, ${c2} 100%)`;
  if(st==='Image' && img) return `background:${c} url(${img}) center/cover no-repeat`;
  return `background:${c}`;
}
/* ============================================================================
   LOGO BLUR
   The dominant colours are sampled out of the client's logo, painted as soft
   ovals across the screen, then washed with a light or dark overlay so the
   copy on top stays readable. Same engine as the SmartTab event pages.
   Oval placement is FIXED, not random: the preview re-renders on every
   keystroke, and a background that reshuffled each time would be unusable.
   ============================================================================ */
function bokehLayer(){
  if(val('__bg','style')!=='Logo blur') return '';
  return `<canvas class="bokeh" id="bokehCanvas" width="390" height="844"></canvas>`;
}
const BOKEH = {src:null, colors:null};
/* x, y and radius as fractions — six ovals, spread corner to corner */
const BLOBS = [[.16,.10,.46],[.84,.06,.40],[.52,.32,.50],[.10,.60,.46],[.90,.56,.42],[.44,.94,.52]];

function hexToRgb(h){ const [r,g,b]=hex2rgb(parseColor(h).hex); return {r,g,b}; }
/* a logo with no usable colour still gets a wash, built from the accent */
function bokehFallback(){
  const a=hexToRgb(tok('accent')), b=hexToRgb(tok('buttonBg'));
  return [a, b, {r:Math.round((a.r+b.r)/2), g:Math.round((a.g+b.g)/2), b:Math.round((a.b+b.b)/2)}];
}
function sampleLogoColors(img){
  try{
    const S=48, c=document.createElement('canvas');
    c.width=S; c.height=S;
    const cx=c.getContext('2d', {willReadFrequently:true});
    cx.drawImage(img,0,0,S,S);
    const d=cx.getImageData(0,0,S,S).data;
    /* first pass keeps only saturated colour; a monochrome mark falls through
       to the second, which accepts anything that isn't paper white */
    const pick = strict => {
      const bucket={};
      for(let i=0;i<d.length;i+=4){
        if(d[i+3]<128) continue;                       /* logos are transparent */
        const q=v=>Math.min(255, Math.round(v/32)*32);
        const r=q(d[i]), g=q(d[i+1]), b=q(d[i+2]);
        const lum=(r+g+b)/3, mx=Math.max(r,g,b), mn=Math.min(r,g,b);
        if(strict){ if(lum<30||lum>230||mx-mn<25) continue; }
        else      { if(lum>245) continue; }
        const k=r+','+g+','+b; bucket[k]=(bucket[k]||0)+1;
      }
      return Object.entries(bucket).sort((a,b)=>b[1]-a[1]).slice(0,6)
        .map(([k])=>{ const p=k.split(',').map(Number); return {r:p[0],g:p[1],b:p[2]}; });
    };
    const strict=pick(true);
    return strict.length ? strict : (pick(false).length ? pick(false) : null);
  }catch(e){ return null; }                            /* a tainted canvas just falls back */
}
function drawBokeh(cv, colors, mode){
  const ctx=cv.getContext('2d'), w=cv.width, h=cv.height, max=Math.max(w,h);
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle = mode==='dark' ? '#101013' : '#F4F5F8';
  ctx.fillRect(0,0,w,h);
  ctx.globalCompositeOperation = mode==='dark' ? 'screen' : 'multiply';
  const alpha = mode==='dark' ? .62 : .42;
  BLOBS.forEach((p,i)=>{
    const c=colors[i%colors.length];
    const x=p[0]*w, y=p[1]*h, rad=max*p[2]*0.5;
    const g=ctx.createRadialGradient(x,y,0,x,y,rad);
    g.addColorStop(0, `rgba(${c.r},${c.g},${c.b},${alpha})`);
    g.addColorStop(1, `rgba(${c.r},${c.g},${c.b},0)`);
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
  });
  /* the wash that keeps the copy legible over whatever the logo turned out to be */
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle = mode==='dark' ? 'rgba(10,10,13,.42)' : 'rgba(255,255,255,.46)';
  ctx.fillRect(0,0,w,h);
}
function paintBokeh(){
  const cv=document.getElementById('bokehCanvas'); if(!cv) return;
  const mode=activeMode(), src=tok('logo');
  if(!src){ drawBokeh(cv, bokehFallback(), mode); return; }
  if(BOKEH.src===src && BOKEH.colors){ drawBokeh(cv, BOKEH.colors, mode); return; }
  drawBokeh(cv, BOKEH.colors || bokehFallback(), mode);   /* something now */
  const img=new Image();
  img.onload=()=>{
    BOKEH.src=src; BOKEH.colors=sampleLogoColors(img) || bokehFallback();
    const live=document.getElementById('bokehCanvas');
    if(live) drawBokeh(live, BOKEH.colors, activeMode());
  };
  img.src=src;
}

/* outline + label for the current selection, drawn outside the clipping frame */
function paintSelection(){
  const fw=document.getElementById('fitwrap'); if(!fw) return;
  fw.querySelectorAll('.selbox').forEach(n=>n.remove());
  if(!state.sel || state.sel==='__bg') return;          /* __bg outlines the frame itself */
  const el=document.querySelector(`[data-el="${state.sel}"]`); if(!el) return;
  const a=el.getBoundingClientRect(), b=fw.getBoundingClientRect();
  const box=document.createElement('div');
  box.className='selbox';
  box.style.cssText=`left:${a.left-b.left-5}px;top:${a.top-b.top-5}px;width:${a.width+10}px;height:${a.height+10}px`;
  box.innerHTML=`<span class="tagline">${curScreen().els[state.sel].label}</span>`;
  fw.appendChild(box);
  /* An uploaded image has no height until it decodes, so measuring straight after
     render gives a sliver. Re-measure once each image is in. */
  const imgs=[...(el.tagName==='IMG'?[el]:[]), ...el.querySelectorAll('img')];
  imgs.forEach(im=>{ if(!im.complete) im.addEventListener('load', ()=>paintSelection(), {once:true}); });
}

/* The device renders at TRUE size (390x844) so every value in the inspector is a
   real device value — then it's scaled down to a comfortable canvas size. The cap
   keeps the preview the same size on screen regardless of the device dimensions. */
const DISPLAY_CAP = {mobile:{w:330,h:668}, desktop:{w:560,h:430}};
function fitDevice(){
  const w=document.getElementById('fitwrap'); if(!w) return;
  const f=w.querySelector('.frame'), st=document.getElementById('stage');
  const H=f.offsetHeight, W=f.offsetWidth;
  const cap=DISPLAY_CAP[f.classList.contains('desktop')?'desktop':'mobile'];
  const fit=Math.min(cap.w/W, cap.h/H, (st.clientHeight-40)/H, (st.clientWidth-130)/W);
  w.style.setProperty('--fit',fit.toFixed(3));
  w.style.height=Math.round(H*fit)+'px'; w.style.width=Math.round(W*fit)+'px';
  paintSelection();                      /* rects change with the scale */
}

const BG_STYLES=['Solid','Gradient','Image','Logo blur'];
function readFile(input, cb){ const f=input.files[0]; if(!f) return; const r=new FileReader(); r.onload=e=>cb(e.target.result); r.readAsDataURL(f); }

/* the last few uploads are kept so the same mark can be reused on the next
   element — e.g. giving all three step icons the same custom icon */
let RECENT=[];
function pushRecent(d){ if(!d) return; RECENT=[d, ...RECENT.filter(x=>x!==d)].slice(0,10); }
function toggleRecent(e, btn){
  e.stopPropagation();
  const box=btn.closest('.upload'), was=box.classList.contains('open');
  document.querySelectorAll('.upload.open').forEach(u=>u.classList.remove('open'));
  if(!was) box.classList.add('open');
}
document.addEventListener('click', ()=> document.querySelectorAll('.upload.open').forEach(u=>u.classList.remove('open')));

function applyUpload(d, target){
  const p=target.split('|');
  if(p[0]==='tok') setToken(p[1], d); else setProp(p[1], p[2], d);
}
function uploadTo(input, target){ readFile(input, d=>{ pushRecent(d); applyUpload(d, target); }); }

function uploadCtl(current, target){
  const id='u'+Math.random().toString(36).slice(2,8);
  const recents = RECENT.length ? `<div class="recent"><div class="rh">Recently used</div>
    <div class="row2">${RECENT.map((d,i)=>`<button class="rthumb" title="Use this"
      onclick="applyUpload(RECENT[${i}],'${target}')"><img src="${d}"></button>`).join('')}</div></div>` : '';
  const preview = current?`<img src="${current}" alt="">`:'<span class="ph">none</span>';
  /* no recents yet means nothing to open — so no caret and no button */
  const thumb = RECENT.length
    ? `<button class="thumb" title="Recently used" onclick="toggleRecent(event,this)">${preview}</button>`
    : `<span class="thumbplain">${preview}</span>`;
  return `<div class="upload">
    ${thumb}
    <label class="btn" for="${id}">${current?'Replace':'Upload'}</label>
    <input id="${id}" type="file" accept="image/*" hidden onchange="uploadTo(this,'${target}')">
    ${current?`<button class="btn" onclick="applyUpload('','${target}')">Remove</button>`:''}
    ${recents}</div>`;
}

/* ---------------------------------------------------------------------------
   Typing must not re-render the panel. Every control edits LIVE (model +
   canvas only) and commits on blur, so the caret stays put and a colour
   picker stays open while you drag across it.
   --------------------------------------------------------------------------- */
let lastMark='';
function markOnce(k){
  const now=Date.now();
  if(lastMark.k===k && now-lastMark.t<1200){ lastMark={k,t:now}; return; }
  lastMark={k,t:now}; mark();
}
function liveProp(elId,prop,v,numeric){
  const k=key(state.screen,state.variant,elId,prop);
  overrides[k]= numeric ? (parseFloat(v)||0) : v;
  renderScreen(); renderRail(); updateChrome();
}
function liveToken(k,v,numeric){
  if(TOKENS[k].modal) TOKENS[k].values[activeMode()] = v;
  else TOKENS[k].value = numeric ? (parseFloat(v)||0) : v;
  renderScreen(); updateChrome();
}
function commit(){ renderInspector(); }
/* keep the paired number box / hex field / swatch in sync without a re-render */
function syncPair(input, value, swatchSel){
  const row=input.closest('.row');
  if(!row) return;
  const partner=row.querySelector(input.classList.contains('numbox')?'input[type=range]':'.numbox');
  if(partner && partner!==input) partner.value=value;
  const hex=row.querySelector('.hex'); if(hex && input.type==='color') hex.value=value.toUpperCase();
  const sw=row.querySelector('.swatch'); if(sw) sw.style.background=value;
}

function sliderCtl(value, min, max, step, live, markKey){
  const n=parseFloat(value);
  return `<div class="sliderrow">
    <input type="range" min="${min}" max="${max}" step="${step}" value="${n}"
      onpointerdown="markOnce('${markKey}')" oninput="${live}" onchange="commit()">
    <input type="text" class="numbox" value="${n}" oninput="${live}" onfocus="markOnce('${markKey}')" onchange="commit()">
  </div>`;
}
let RECENT_COLORS=[];
function pushRecentColor(c){
  if(!/^#[0-9a-f]{6}$/i.test(c||'')) return;
  c=c.toUpperCase();
  RECENT_COLORS=[c, ...RECENT_COLORS.filter(x=>x!==c)].slice(0,8);
}
function applyColor(c, target){
  pushRecentColor(c);
  const p=target.split('|');
  if(p[0]==='tok') setToken(p[1], c); else setProp(p[1], p[2], c);
}
/* committing (not every drag frame) is what earns a place in the palette */
function commitColor(input){ pushRecentColor(input.value); commit(); }

/* ---------------------------------------------------------------------------
   Colour picker. Built rather than borrowed: the native one can't show a
   recently-used palette, and it closes on every drag.
   --------------------------------------------------------------------------- */
const PICK={target:null, mk:'', h:0, s:1, v:1, a:1, open:false};
/* Values are stored as #RRGGBB, or #RRGGBBAA once opacity is below 100% —
   CSS understands both, so nothing downstream has to special-case it. */
function parseColor(v){
  v=String(v==null?'':v).trim();
  const m=v.match(/^rgba?\(([^)]+)\)$/i);
  if(m){ const n=m[1].split(',').map(x=>parseFloat(x));
    return {hex:'#'+n.slice(0,3).map(x=>Math.max(0,Math.min(255,Math.round(x||0))).toString(16).padStart(2,'0')).join('').toUpperCase(),
            a: n.length>3 ? Math.max(0,Math.min(1,n[3])) : 1}; }
  let h=v.replace('#','');
  if(h.length===3||h.length===4) h=h.split('').map(c=>c+c).join('');
  let a=1;
  if(h.length===8){ a=parseInt(h.slice(6,8),16)/255; h=h.slice(0,6); }
  if(!/^[0-9a-f]{6}$/i.test(h)) return {hex:'#000000', a:1};
  return {hex:'#'+h.toUpperCase(), a};
}
const withAlpha=(hex,a)=> a>=.999 ? hex : hex+Math.round(a*255).toString(16).padStart(2,'0').toUpperCase();
const pickValue=()=> withAlpha(hsv2hex(PICK.h,PICK.s,PICK.v), PICK.a);
/* a flat colour layer over the checkerboard */
const swatchStyle=v=>`background-image:linear-gradient(${v},${v}),var(--checker);`
  +`background-size:auto,var(--checker-size);background-position:0 0,var(--checker-pos)`;
function hex2rgb(h){ h=(h||'#000000').replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join('');
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; }
function rgb2hsv(r,g,b){ r/=255;g/=255;b/=255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn; let h=0;
  if(d){ h = mx===r ? ((g-b)/d+(g<b?6:0)) : mx===g ? ((b-r)/d+2) : ((r-g)/d+4); h*=60; }
  return [h, mx?d/mx:0, mx]; }
function hsv2hex(h,s,v){
  const f=n=>{ const k=(n+h/60)%6, c=v-v*s*Math.max(0,Math.min(k,4-k,1));
    return Math.round(c*255).toString(16).padStart(2,'0'); };
  return ('#'+f(5)+f(3)+f(1)).toUpperCase(); }
function rgb2hsl(r,g,b){ r/=255;g/=255;b/=255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn, l=(mx+mn)/2; let h=0,s=0;
  if(d){ s = l>.5 ? d/(2-mx-mn) : d/(mx+mn);
    h = mx===r ? ((g-b)/d+(g<b?6:0)) : mx===g ? ((b-r)/d+2) : ((r-g)/d+4); h*=60; }
  return [Math.round(h), Math.round(s*100), Math.round(l*100)]; }
function hsl2hex(h,s,l){ s/=100; l/=100;
  const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l);
  const f=n=>Math.round(255*(l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1))))).toString(16).padStart(2,'0');
  return ('#'+f(0)+f(8)+f(4)).toUpperCase(); }
function setPickFromHex(hex){ const [h,s,v]=rgb2hsv(...hex2rgb(hex)); PICK.h=h; PICK.s=s; PICK.v=v; }

/* HEX / RGB / HSL, the way the browser's own picker cycles them */
let PICK_FORMAT='HEX';
const FMT_ORDER=['HEX','RGB','HSL'];
function cycleFormat(e){ e.stopPropagation();
  PICK_FORMAT=FMT_ORDER[(FMT_ORDER.indexOf(PICK_FORMAT)+1)%FMT_ORDER.length]; paintPicker(); }
function fieldsHtml(){
  const hex=hsv2hex(PICK.h,PICK.s,PICK.v), [r,g,b]=hex2rgb(hex), [hh,ss,ll]=rgb2hsl(r,g,b);
  const ap=Math.round(PICK.a*100);
  const cyc=`<button class="fmt" onclick="cycleFormat(event)" title="Switch format">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"/></svg></button>`;
  const f=(id,v,lab)=>`<label><input type="text" id="${id}" value="${v}" onchange="fieldEdit()" onkeydown="if(event.key==='Enter')fieldEdit()"><span>${lab}</span></label>`;
  const body = PICK_FORMAT==='HEX' ? f('f1',withAlpha(hex,PICK.a),'HEX')
    : PICK_FORMAT==='RGB' ? f('f1',r,'R')+f('f2',g,'G')+f('f3',b,'B')+f('f4',ap+'%','A')
    : f('f1',hh,'H')+f('f2',ss+'%','S')+f('f3',ll+'%','L')+f('f4',ap+'%','A');
  return `<div class="frow">${body}${cyc}</div>`;
}
function fieldEdit(){
  const g=id=>{const e=document.getElementById(id); return e?e.value.trim().replace('%',''):''};
  const alpha=()=>{ const v=g('f4'); return v===''?PICK.a:Math.max(0,Math.min(1,(parseFloat(v)||0)/100)); };
  let hex=null, a=PICK.a;
  if(PICK_FORMAT==='HEX'){ const c=parseColor(g('f1')); if(g('f1')){ hex=c.hex; a=c.a; } }
  else if(PICK_FORMAT==='RGB'){ const n=[g('f1'),g('f2'),g('f3')].map(x=>Math.max(0,Math.min(255,parseInt(x)||0)));
      hex='#'+n.map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase(); a=alpha(); }
  else { hex=hsl2hex(parseFloat(g('f1'))||0, Math.max(0,Math.min(100,parseFloat(g('f2'))||0)), Math.max(0,Math.min(100,parseFloat(g('f3'))||0))); a=alpha(); }
  if(!hex) { paintPicker(); return; }
  setPickFromHex(hex); PICK.a=a; paintPicker(); pushPick();
}
/* native screen eyedropper where the browser supports it */
async function eyedrop(e){
  e.stopPropagation();
  if(!window.EyeDropper) return;
  try{ const res=await new EyeDropper().open(); setPickFromHex(res.sRGBHex.toUpperCase()); paintPicker(); pushPick(); }
  catch(_){ /* cancelled */ }
}

function paintPicker(){
  const hex=hsv2hex(PICK.h,PICK.s,PICK.v), out=pickValue();
  const sv=document.getElementById('svArea');
  sv.style.background=`linear-gradient(to top, #000, rgba(0,0,0,0)), linear-gradient(to right, #fff, hsl(${PICK.h},100%,50%))`;
  const dot=document.getElementById('svDot');
  dot.style.left=(PICK.s*100)+'%'; dot.style.top=((1-PICK.v)*100)+'%';
  document.getElementById('hueSlider').value=Math.round(PICK.h);
  const al=document.getElementById('alphaSlider');
  al.value=Math.round(PICK.a*100);
  const [r0,g0,b0]=hex2rgb(hex);
  al.style.backgroundImage=`linear-gradient(to right, rgba(${r0},${g0},${b0},0), rgb(${r0},${g0},${b0})),var(--checker)`;
  document.getElementById('cpPreview').setAttribute('style', swatchStyle(out));
  document.getElementById('cFields').innerHTML=fieldsHtml();
  const sw=document.getElementById('cpopSwatches');
  sw.innerHTML=RECENT_COLORS.map(c=>`<button class="cchip" style="${swatchStyle(c)}" title="${c}" onclick="pickChip('${c}')"></button>`).join('');
  const show=RECENT_COLORS.length?'':'none';
  document.getElementById('cpopRh').style.display=show;
  sw.style.display=show;
  return hex;
}
function pushPick(){
  const out=pickValue();
  const p=PICK.target.split('|');
  if(p[0]==='tok') liveToken(p[1],out); else liveProp(p[1],p[2],out);
  /* keep the row's swatch and hex field in step without rebuilding the panel */
  const live=document.querySelector(`.insp .swatch[data-target="${PICK.target}"]`);
  if(live) PICK.swatchEl=live;
  if(PICK.swatchEl && PICK.swatchEl.isConnected){
    PICK.swatchEl.dataset.color=out;
    PICK.swatchEl.setAttribute('style', swatchStyle(out));
    const hx=PICK.swatchEl.parentElement.querySelector('.hex'); if(hx) hx.value=out; }
}
function openPicker(e, btn, target, mk){
  e.stopPropagation();
  if(PICK.open && PICK.swatchEl===btn){ closePicker(); return; }   /* click again to close */
  /* Measure BEFORE closing the previous picker: closing repaints the panel, which
     detaches this very button — measuring it afterwards gives a 0,0 rect and the
     popover lands in the top-left corner. */
  const r=btn.getBoundingClientRect();
  const cur=btn.dataset.color||'#000000';
  if(PICK.open) closePicker();
  markOnce(mk);
  const c=parseColor(cur);
  const [h,sa,v]=rgb2hsv(...hex2rgb(c.hex));
  /* re-find the live button in case the panel was rebuilt */
  const liveBtn=document.querySelector(`.insp .swatch[data-target="${target}"]`)||btn;
  Object.assign(PICK,{target, mk, h, s:sa, v, a:c.a, open:true, swatchEl:liveBtn});
  const pop=document.getElementById('cpop');
  pop.classList.add('open');
  const top=Math.min(r.bottom+6, innerHeight-pop.offsetHeight-10);
  pop.style.top=top+'px';
  pop.style.left=Math.max(10, Math.min(r.left, innerWidth-pop.offsetWidth-10))+'px';
  paintPicker();
}
function closePicker(){
  if(!PICK.open) return;
  PICK.open=false;
  document.getElementById('cpop').classList.remove('open');
  pushRecentColor(pickValue());
  commit();                       /* repaint the panel once, at the end */
}
function pickChip(c){
  const p=parseColor(c);
  const [h,sa,v]=rgb2hsv(...hex2rgb(p.hex));
  Object.assign(PICK,{h,s:sa,v,a:p.a});
  paintPicker(); pushPick();
}
(function wirePicker(){
  const sv=document.getElementById('svArea'), hue=document.getElementById('hueSlider'), pop=document.getElementById('cpop');
  const move=e=>{ const r=sv.getBoundingClientRect();
    PICK.s=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
    PICK.v=Math.max(0,Math.min(1,1-(e.clientY-r.top)/r.height));
    paintPicker(); pushPick(); };
  sv.addEventListener('pointerdown',e=>{
    try{ sv.setPointerCapture(e.pointerId); }catch(_){}   /* no-op without a real pointer */
    move(e);
    const mv=ev=>move(ev); const up=()=>{ sv.removeEventListener('pointermove',mv); removeEventListener('pointerup',up); };
    sv.addEventListener('pointermove',mv); addEventListener('pointerup',up); });
  hue.addEventListener('input',()=>{ PICK.h=+hue.value; paintPicker(); pushPick(); });
  document.getElementById('alphaSlider').addEventListener('input',function(){ PICK.a=(+this.value)/100; paintPicker(); pushPick(); });
  pop.addEventListener('click',e=>e.stopPropagation());
  const eye=document.getElementById('eyeBtn');
  eye.addEventListener('click', eyedrop);
  if(!window.EyeDropper){ eye.disabled=true; eye.title='Your browser doesn\u2019t support the screen eyedropper'; }
  document.addEventListener('click', closePicker);
  addEventListener('scroll', closePicker, true);
})();
