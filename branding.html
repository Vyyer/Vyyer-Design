/* ============================================================================
   TYPEFACES
   Vyyer ships Inter and lets a client upload up to three faces of their own.
   The upload registers a real @font-face — naming a family the browser can't
   draw would make the preview a lie — and the picker shows every option set
   in its own face.
   ============================================================================ */
const MAX_FONTS = 3;
let CUSTOM_FONTS = [];                                  /* [{name, url}] */
const fontNames  = ()=> ['Inter', ...CUSTOM_FONTS.map(f=>f.name)];
const fontStack  = n => {
  const f=String(n||'Inter').replace(/['"]/g,'');
  return f==='Inter' ? 'Inter, system-ui, sans-serif' : `'${f}', Inter, system-ui, sans-serif`;
};

function syncFontFaces(){
  let st=document.getElementById('customFonts');
  if(!st){ st=document.createElement('style'); st.id='customFonts'; document.head.appendChild(st); }
  st.textContent = CUSTOM_FONTS.map(f=>
    `@font-face{font-family:'${f.name}';src:url("${f.url}");font-display:swap}`).join('\n');
}
function fontFileName(f){
  return (f.name.replace(/\.(ttf|otf|woff2?|eot)$/i,'').replace(/[-_]+/g,' ').trim() || 'Custom font')
         .replace(/['"]/g,'').slice(0,32);
}
function addFontFile(file, then){
  if(!file || CUSTOM_FONTS.length>=MAX_FONTS) return;
  let name=fontFileName(file), n=2;
  while(fontNames().includes(name)) name = fontFileName(file)+' '+(n++);
  const r=new FileReader();
  r.onload=e=>{ CUSTOM_FONTS.push({name, url:e.target.result}); syncFontFaces(); if(then) then(name); touch(); };
  r.readAsDataURL(file);
}
/* the file dialog is opened from a throwaway input so every font picker and
   the manager share one code path */
function pickFontFile(then){
  const i=document.createElement('input');
  i.type='file'; i.accept='.ttf,.otf,.woff,.woff2,font/ttf,font/otf,font/woff,font/woff2';
  i.onchange=()=>addFontFile(i.files[0], then);
  i.click();
}
function removeFont(i){
  const gone=CUSTOM_FONTS[i].name;
  CUSTOM_FONTS.splice(i,1); syncFontFaces();
  /* anything still set to it falls back to Inter rather than rendering in a
     family that no longer exists */
  Object.keys(TOKENS).forEach(k=>{ if(TOKENS[k].type==='font' && TOKENS[k].value===gone) TOKENS[k].value='Inter'; });
  Object.keys(overrides).forEach(k=>{ if(k.endsWith('|font') && overrides[k]===gone) delete overrides[k]; });
  touch();
}

/* ---------- custom dropdown (no native select anywhere) ---------- */
let ddSeq=0; let DD_PICK={};
const DD_TICK='<svg class="tk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5 10-11"/></svg>';
function ddCtl(value, options, pick){
  const id='dd'+(++ddSeq); DD_PICK[id]=pick;
  const cur = options.find(o=>!o.sep && o.v===value);
  const items = options.map((o,i)=>
      o.sep  ? '<div class="sep"></div>'
    : o.note ? `<div class="ddnote">${esc(o.note)}</div>`
    : `<div class="ddrow${o.v===value?' on':''}">
         <button type="button" class="ddpick${o.cls?' '+o.cls:''}" onclick="ddPick(event,'${id}',${i})"${o.style?` style="${o.style}"`:''}>
           ${DD_TICK}<span class="v">${esc(o.label||o.v)}</span>${o.muted?`<span class="mut">${esc(o.muted)}</span>`:''}</button>
         ${o.del==null?'':`<button type="button" class="ddx" title="Remove font" aria-label="Remove ${esc(o.label||o.v)}" onclick="ddDel(event,${o.del})">
           <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button>`}
       </div>`).join('');
  DD_PICK[id+'_opts']=options;
  return `<div class="dd" id="${id}"><button type="button" onclick="ddToggle(event,'${id}')">
      <span class="v"${cur&&cur.style?` style="${cur.style}"`:''}>${esc(cur?(cur.label||cur.v):(value==null?'':value))}</span>
      <svg class="cv" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
    </button><div class="ddm">${items}</div></div>`;
}
function ddToggle(e,id){
  e.stopPropagation();
  const el=document.getElementById(id), was=el.classList.contains('open');
  document.querySelectorAll('.dd.open').forEach(d=>d.classList.remove('open'));
  if(!was) el.classList.add('open');
}
function ddDel(e,i){ e.stopPropagation(); removeFont(i); }
function ddPick(e,id,i){
  e.stopPropagation();
  const el=document.getElementById(id); if(el) el.classList.remove('open');
  const o=(DD_PICK[id+'_opts']||[])[i], f=DD_PICK[id];
  if(o && f) f(o.v);
}
document.addEventListener('click', ()=>document.querySelectorAll('.dd.open').forEach(d=>d.classList.remove('open')));

/* a font picker previews each face and offers the upload until three are in */
function fontCtl(value, pick){
  const left = MAX_FONTS - CUSTOM_FONTS.length;
  const opts = [{v:'Inter', style:`font-family:${fontStack('Inter')}`}];
  CUSTOM_FONTS.forEach((f,i)=> opts.push({v:f.name, style:`font-family:${fontStack(f.name)}`, del:i}));
  opts.push({sep:true});
  opts.push(left>0
    ? {v:'__upload', label:'Upload custom font…', cls:'up', muted: CUSTOM_FONTS.length?`${CUSTOM_FONTS.length} of ${MAX_FONTS}`:''}
    : {note:`All ${MAX_FONTS} custom fonts uploaded — remove one to add another.`});
  return ddCtl(value, opts, v => v==='__upload' ? pickFontFile(pick) : pick(v));
}
/* 700 is the heaviest weight Vyyer ships */
const WEIGHTS=[[300,'Light'],[400,'Regular'],[500,'Medium'],[600,'Semibold'],[700,'Bold']];
function weightCtl(value, pick){
  return ddCtl(String(value||400), WEIGHTS.map(([w,l])=>({v:String(w), label:`${l} · ${w}`, style:`font-weight:${w}`})),
    v=>pick(+v));
}

function ctlFor(type, value, elId, prop){
  const mk=elId+'|'+prop;
  const live=`liveProp('${elId}','${prop}',this.value${type==='radius'||type==='scale'?',1':''});syncPair(this,this.value)`;
  if(type==='color')  return colorCtl(value, live, mk, `el|${elId}|${prop}`);
  if(type==='align')  return alignCtl(value, elId, prop);
  if(type==='bullet') return bulletCtl(value, elId, prop);
  if(type==='listlong') return listFieldCtl(value, live, mk);
  if(type==='radius') return sliderCtl(value, 0, 32, 1, live, mk);
  if(type==='scale')  return sliderCtl(value, .5, 2, .05, live, mk);
  if(type==='upload') return uploadCtl(value, `el|${elId}|${prop}`);
  if(type==='font')   return fontCtl(value, v=>setProp(elId,prop,v));
  if(type==='weight') return weightCtl(value, v=>setProp(elId,prop,v));
  if(type==='url')    return `<input type="text" inputmode="url" placeholder="https://" value="${esc(value||'')}" onfocus="markOnce('${mk}')" oninput="${live}" onchange="commit()">`;
  if(type==='toggle') return toggleCtl(value, `setProp('${elId}','${prop}',${!value})`);
  if(type==='long')   return `<textarea onfocus="markOnce('${mk}')" oninput="${live};autosize(this)" onchange="commit()">${esc(value)}</textarea>`;
  return `<input type="text" value="${esc(value||'')}" onfocus="markOnce('${mk}')" oninput="${live}" onchange="commit()">`;
}

           ['boxColor','Checkbox outline','color'],
           ['checkedFill','Checkbox fill','color'],['checkedTick','Checkmark','color']],
  step:   [['title','Step title','text'],['titleWeight','Title weight','weight'],
           ['desc','Step description','text'],['descWeight','Description weight','weight']],
};

/* The company name is one value shared by every line that mentions it, so it
   can be set from whichever of those lines the client happens to be editing —
   the wording of each line is still theirs to change. */
function companyRow(where){
  const t=TOKENS.company, v=t.value||'';
  const reset = v ? `<button class="reset" title="Clear" onclick="setToken('company','')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 12a9 9 0 109-9 9 9 0 00-6.4 2.6L3 8"/><path d="M3 3v5h5"/></svg></button>` : '';
  return `<div class="row"><div class="lbl"><span>${t.label}</span>
      <span class="src${v?' custom':''}">${v?'Set':'Not set'}</span>${reset}</div>
    <input type="text" value="${attrEsc(v)}" placeholder="${t.placeholder}"
      onfocus="markOnce('tok|company')" oninput="liveToken('company',this.value)" onchange="commit()">
    <div class="note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01" stroke-linecap="round"/></svg>${
      where==='global' ? t.note : 'Shared with every other line that uses {Company} \u2014 the title, the purpose line and the consent checkbox.'}</div></div>`;
}

/* Every uploaded image is mode-dependent, the same way the company logo is:
   an icon or illustration drawn for a dark screen rarely survives a light one.
   Driven off PROP_UI so a new upload prop is covered the day it is added. */
SCREENS.forEach(scr=>Object.values(scr.els).forEach(el=>{
  (PROP_UI[el.type]||[]).forEach(([prop,,type])=>{
    const spec = el.props[prop];
    if(type==='upload' && spec && !spec.bind) spec.modal = true;   /* bound ones follow their token */
  });
}));

/* background gets a conditional panel: the style choice decides the rest */
function bgRows(){
  const st = resolve(state.screen,state.variant,'__bg','style');
  const picker = `<div class="row"><div class="lbl"><span>Background style</span>
      <span class="${st.source==='custom'?'src custom':'src'}">${st.source==='custom'?'Custom':(st.source==='global'?'Global':'Default')}</span>
      ${st.source==='custom'?`<button class="reset" onclick="resetProp('__bg','style')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 12a9 9 0 109-9 9 9 0 00-6.4 2.6L3 8"/><path d="M3 3v5h5"/></svg></button>`:''}</div>
    <div class="bgstyles">${BG_STYLES.map(b=>`<button class="${b===st.value?'on':''}" onclick="setProp('__bg','style','${b}')">${b}</button>`).join('')}</div></div>`;
  let rest='';
  if(st.value==='Solid')    rest = propRow('__bg','color','Background color','color');
  if(st.value==='Gradient') rest = propRow('__bg','color','Gradient start','color') + propRow('__bg','color2','Gradient end','color');
  if(st.value==='Image')    rest = propRow('__bg','image','Image','upload') + propRow('__bg','color','Fallback color','color');
  if(st.value==='Logo blur')rest =
    `<div class="note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01" stroke-linecap="round"/></svg>
     Builds a blurred bokeh wash from the company logo for this theme mode.</div>`;
  return picker + rest;
}

function modeChip(){
  if(TOKENS.theme.value!=='Dynamic') return '';
  const m=activeMode();
  const icon = m==='dark' ? '<path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/>'
                          : '<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2" stroke-linecap="round"/>';
  return `<span class="sp"></span><button class="modechip" onclick="setMode('${m==='dark'?'light':'dark'}')" title="Switch the values you're editing">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">${icon}</svg>${m}</button>`;
}

function autosize(ta){
  ta.style.height='auto';
  ta.style.height=Math.min(300, Math.max(112, ta.scrollHeight+2))+'px';
}
/* Toggles and pickers rebuild the whole panel, which would otherwise scroll it
   back to the top mid-edit. Scroll is kept while the SAME panel is repainted,
   and reset when a different element (or screen) takes it over. */
let lastPanelKey='';
function paintInspector(html){
  const insp=document.getElementById('insp');
  const key=[state.panel, state.screen, state.variant, state.sel].join('|');
  const keep = key===lastPanelKey ? insp.scrollTop : 0;
  lastPanelKey=key;
  insp.innerHTML=html;
  insp.querySelectorAll('textarea').forEach(ta=>{ autosize(ta); if(ta.dataset.gutter) syncGutter(ta); });
  insp.scrollTop=keep;
}
/* every repaint rebuilds its dropdowns, so the old handlers go with it */
function renderInspector(){
  DD_PICK={};
  const insp=document.getElementById('insp');
  if(state.panel==='brand' && !state.sel){
    const groups={};
    Object.entries(TOKENS).forEach(([k,t])=>{(groups[t.group]=groups[t.group]||[]).push([k,t])});
    let html=`<div class="hd"><div class="k">Brand</div><h3>Global settings</h3>
      <p>Every screen inherits these. Click an element to override and set custom values.</p></div>`;
    GROUP_ORDER.forEach(g=>{
      const list=groups[g]; if(!list) return;
      const anyModal=list.some(([,t])=>t.modal);
      const badge = anyModal ? modeChip() : `<span class="sp"></span><span class="shared">shared across modes</span>`;
      html+=`<div class="sec"><h5>${g}${badge}</h5>`;
      list.forEach(([k,t])=>{
        if(t.type==='bgstyle'){
          html+=`<div class="row"><div class="lbl"><span>${t.label}</span></div>
            <div class="bgstyles">${BG_STYLES.map(b=>`<button class="${b===tok(k)?'on':''}" onclick="setToken('${k}','${b}')">${b}</button>`).join('')}</div></div>`;
        } else if(t.type==='color'){
          if(k==='pageBg2' && tok('bgStyle')!=='Gradient') return;
          if(k==='pageBg'  && (tok('bgStyle')==='Image' || tok('bgStyle')==='Logo blur')) return;
          html+=`<div class="row"><div class="lbl"><span>${t.label}</span></div>
            ${colorCtl(tok(k), `liveToken('${k}',this.value);syncPair(this,this.value)`, 'tok|'+k, 'tok|'+k)}</div>`;
        } else if(t.type==='upload'){
          if(k==='pageImg' && tok('bgStyle')!=='Image') return;
          html+=`<div class="row"><div class="lbl"><span>${t.label}</span></div>${uploadCtl(tok(k),`tok|${k}`)}</div>`;
        } else if(t.type==='radius'){
          html+=`<div class="row"><div class="lbl"><span>${t.label}</span></div>
            ${sliderCtl(t.value,0,32,1,`liveToken('${k}',this.value,1);syncPair(this,this.value)`,'tok|'+k)}</div>`;
        } else if(t.type==='font'){
          html+=`<div class="row"><div class="lbl"><span>${t.label}</span></div>
            ${fontCtl(t.value, v=>setToken(k,v))}</div>`;
        } else if(t.type==='toggle'){
          html+=`<div class="row"><div class="lbl"><span>${t.label}</span></div>
            ${toggleCtl(tok(k), `setToken('${k}',${!tok(k)})`)}
            ${t.note?`<div class="note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01" stroke-linecap="round"/></svg>${t.note}</div>`:''}</div>`;
        } else if(t.type==='select'){
          html+=`<div class="row"><div class="lbl"><span>${t.label}</span></div>
            ${ddCtl(t.value, t.options.map(o=>({v:o})), v=>setToken(k,v))}</div>`;
        } else if(t.type==='text'){
          html+=companyRow('global');
        } else if(t.type==='logo'){
          html+=`<div class="row"><div class="lbl"><span>${t.label}</span></div>${uploadCtl(tok(k),`tok|${k}`)}</div>`;
        }
      });
      html+='</div>';
    });
    paintInspector(html); return;
  }

  const scr=curScreen(), el=scr.els[state.sel];
  if(!el){ paintInspector(`<div class="hd"><div class="k">${scr.name}</div><h3>Nothing selected</h3></div>
    <div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l7.5 18 2.6-7.9L21 10.5z"/></svg>
    <div>Click an element in the screen to style just that element.<br><br>Deselect to change something everywhere at once.</div></div>`); return; }

  /* anything that declares a `show` prop gets a Visible toggle, first */
  const vis = ('show' in el.props) ? propRow(state.sel,'show','Visible','toggle') : '';
  /* set once, where the name is most obviously the subject — the other lines
     keep the placeholder and can be reworded in their own text box */
  const mer = (state.sel==='title' && hasCompany(val(state.sel,'text'))) ? companyRow('element') : '';
  let rows;
  if(el.type==='bg') rows = bgRows();
  else {
    const map = DIM_WHEN[el.type]||{};
    const list = PROP_UI[el.type]||[];
    const sc = stateScope();
    const picker = statePicker();
    /* the consent screen sizes its copy from the title alone */
    const noSize = state.screen==='consent' && state.sel!=='title';
    const html = list.filter(([p])=>{
      if(noSize && p==='size') return false;
      if(sc && sc.all.has(p) && !sc.keep.has(p)) return false;
      return true;
    }).map(([p,l,t])=>{
      const by = map[p];
      const row = propRow(state.sel,p,l,t, !!(by && val(state.sel, by)));
      return {dim: !!(by && val(state.sel, by)), html: (sc && p===sc.anchor ? picker : '') + row};
    });
    rows = vis + mer + html.map(r=>r.html).join('');
  }
  const nOvr = Object.keys(overrides).filter(k=>k.startsWith(state.screen+'|'+state.variant+'|'+state.sel+'|')).length;
  let applyAll='';
  if(scr.variants && nOvr){
    applyAll=`<div class="sec"><button class="applyall" onclick="applyToAll()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg>
      Apply to all ${scr.variants.length} ${scr.name.toLowerCase()} screens</button></div>`;
  }
  paintInspector(`<div class="hd"><div class="hdtop"><div class="k">${scr.name}${scr.variants?' · '+scr.variants[state.variant]:''}</div>${modeChip()}</div>
      <h3>${el.label}</h3><p>Values marked <b>Global</b> follow your brand settings.</p></div>
    <div class="sec">${rows||'<div class="empty">No style options for this element.</div>'}</div>${applyAll}`);
}

/* ============================================================================
   6. ACTIONS
   ============================================================================ */
function select(elId){
  if(PICK.open) closePicker();          /* otherwise it would keep editing the old element */
  state.sel=elId; state.panel=elId?'element':'brand'; renderScreen(); renderInspector(); }
function setProp(elId,prop,v){
  mark();
  const spec=curScreen().els[elId].props[prop];
  if(spec && typeof spec.value==='number') v=parseFloat(v)||0;
  overrides[key(state.screen,state.variant,elId,prop)]=v; touch(); }
function resetProp(elId,prop){ mark(); delete overrides[key(state.screen,state.variant,elId,prop)]; touch(); }
function setToken(k,v){ mark();
  if(TOKENS[k].modal) TOKENS[k].values[activeMode()] = v;
  else TOKENS[k].value = (TOKENS[k].type==='size') ? parseFloat(v) : v;
  touch(); }
function setMode(m){ mark(); mode=m; touch(); }
function applyToAll(){
  mark();
  const scr=curScreen(), pre=state.screen+'|'+state.variant+'|';
  Object.keys(overrides).filter(k=>k.startsWith(pre)).forEach(k=>{
    const parts=k.split('|'), el=parts[2], prop=parts[3], suffix=parts[4]?'|'+parts[4]:'';
    scr.variants.forEach((_,i)=>{ if(i!==state.variant) overrides[state.screen+'|'+i+'|'+el+'|'+prop+suffix]=overrides[k]; });
  });
  touch();
}
function touch(){ renderModeSwitch(); renderScreen(); renderInspector(); renderRail(); updateChrome(); }
function updateChrome(){
  document.getElementById('saveBtn').disabled = Object.keys(overrides).length===0 && !past.length;
  document.getElementById('undoBtn').disabled = !past.length;
  document.getElementById('redoBtn').disabled = !future.length;
}

/* ---------- rail ---------- */
function entryOverrides(f){ return Object.keys(overrides).filter(k=>k.startsWith(f.id+'|'+f.v+'|')).length }
function renderRail(){
  const groups={};
  FLAT.forEach((f,i)=>{(groups[f.group]=groups[f.group]||[]).push([f,i])});
  document.getElementById('railGroups').innerHTML=Object.entries(groups).map(([g,list])=>{
    const open = list.some(([f])=>f.id===state.screen);
    const items=list.map(([f,i])=>{
      const on = f.id===state.screen && f.v===state.variant;
      const off = f.id==='consent' && !tok('requireConsent');
      return `<button class="screenbtn ${on?'on':''}${off?' off':''}" onclick="goTo(${i})">
        <span class="nm">${f.label}</span>${off?'<span class="skip">Off</span>':''}${entryOverrides(f)&&!off?'<span class="dot"></span>':''}</button>`;
    }).join('');
    return `<div class="grp ${open?'open':''}"><button onclick="this.parentElement.classList.toggle('open')">
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>${g}</button>
      <div class="items">${items}</div></div>`;
  }).join('');
}
function goTo(i){
  const f=FLAT[(i+FLAT.length)%FLAT.length];
  state.screen=f.id; state.variant=f.v; state.sel=null; state.panel='brand';
  document.getElementById('screenName').textContent = f.screen===f.label ? f.screen : f.screen+' · '+f.label;
  renderRail(); renderScreen(); renderInspector();
}
function goScreen(id){ goTo(FLAT.findIndex(f=>f.id===id)); }
/* A screen state belongs to the element that shows it, not to the canvas
   toolbar at the other end of the window — the client is editing the message
   or the checkbox, so the state sits in that element's panel. */
let scanState='default';
let consentChecked=false;
function setScanState(s){ scanState=s; renderScreen(); renderInspector(); }
function setConsentChecked(v){ consentChecked=v; renderScreen(); renderInspector(); }
function stateRow(label, opts, cur, fn){
  return `<div class="row"><div class="lbl"><span>${label}</span></div>
    <div class="picker">${opts.map(([v,l])=>`<button class="${String(v)===String(cur)?'on':''}"
      onclick="${fn}(${typeof v==='string'?`'${v}'`:v})">${l}</button>`).join('')}</div></div>`;
}
/* Which fields belong to which state. Showing all of them at once invites
   editing the error colours while the preview shows success — so the panel
   shows only the selected state's, with the switcher just above them. */
const STATE_FIELDS = {
  'scan|status':    {default:['text','bg','color'], error:['errorBg','errorColor'], success:['successBg','successColor']},
  'consent|release':{false:['boxColor'], true:['checkedFill','checkedTick']},
};
/* props that belong to SOME state — hidden unless that state is current */
function stateScope(){
  const set = STATE_FIELDS[state.screen+'|'+state.sel];
  if(!set) return null;
  const cur = state.sel==='status' ? scanState : String(consentChecked);
  const keep = new Set(set[cur]||[]);
  const all  = new Set(Object.values(set).flat());
  return {keep, all, anchor:(set[cur]||[])[0]};
}
function statePicker(){
  if(state.screen==='scan' && state.sel==='status')
    return stateRow('Message state', [['default','Default'],['error','Error'],['success','Success']], scanState, 'setScanState');
  if(state.screen==='consent' && state.sel==='release')
    return stateRow('Checkbox state', [[false,'Unchecked'],[true,'Checked']], consentChecked, 'setConsentChecked');
  return '';
}
/* the canvas theme switch only exists when the theme is Dynamic —
   otherwise there is only one set of values and a switch would lie */
function renderModeSwitch(){
  const seg=document.getElementById('modeSeg');
  if(TOKENS.theme.value!=='Dynamic'){ seg.style.display='none'; seg.innerHTML=''; return; }
  seg.style.display='';
  seg.innerHTML=['light','dark'].map(m=>`<button class="${m===mode?'on':''}" onclick="setMode('${m}')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">${m==='dark'
      ?'<path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/>'
      :'<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2" stroke-linecap="round"/>'}</svg>${m==='dark'?'Dark':'Light'}</button>`).join('');
}

document.getElementById('undoBtn').onclick=undo;
document.getElementById('redoBtn').onclick=redo;
document.getElementById('discardBtn').onclick=()=>{ mark(); overrides={}; touch(); };
addEventListener('resize',()=>fitDevice());
addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); }
});

/* boot */
renderRail(); renderModeSwitch(); renderScreen(); renderInspector(); updateChrome();
</script>
</body>
</html>
