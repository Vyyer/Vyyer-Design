<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vyyer — Verification Detail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shell.css">
<!-- the stored dashboard theme is applied before paint, so the page never flashes the other one -->
<script>try{document.documentElement.dataset.theme=localStorage.getItem('vyyer.dashTheme')||'light'}catch(e){}</script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f8fafc;
  --surface: #ffffff;
  --surface-2: #edf0f5;
  --border: rgba(0,0,0,0.08);
  --border-md: rgba(0,0,0,0.14);
  --text-primary: #111110;
  --text-secondary: #6f6e6b;
  --text-tertiary: #9d9c99;
  --valid: #3a7d1e;
  --invalid: #d63f3f;
  --expired: #c47a1a;
  --warn: #b0850c;
  --underage: #2e6fb5;
  --incomplete: #7a6c55;
  --accent: #C8FF00;
  --blue: #007aff;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
  --radius-sm: 8px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --font: 'Inter', system-ui, sans-serif;
}

html, body { font-family: var(--font); background: var(--bg); color: var(--text-primary); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; }

/* NAV */

/* LAYOUT */
main { max-width: 1200px; margin: 0 auto; padding: 24px 20px 64px; }
.back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--text-secondary); text-decoration: none; margin-bottom: 20px; transition: color .15s; }
.back-link:hover { color: var(--text-primary); }
.back-link svg { color: var(--text-tertiary); }
.detail-layout { display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: start; }

/* SIDEBAR */
.sidebar { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 72px; }
.sidebar-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow-sm); }
.subject-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.subject-avatar { width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; }
.subject-name { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; color: var(--text-primary); line-height: 1.2; }
.verdict-pill { display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: var(--radius-md); padding: 10px 16px; font-size: 13px; font-weight: 600; margin-bottom: 18px; }
.verdict-pill svg { flex-shrink: 0; }
.vp-valid      { background: #e6f5db; color: var(--valid); }
.vp-invalid    { background: #fde8e8; color: var(--invalid); }
.vp-expired    { background: #f6e6cf; color: var(--expired); }
.vp-underage   { background: #e3eefa; color: var(--underage); }
.vp-incomplete { background: #f1ede6; color: var(--incomplete); }

.meta-rows { display: flex; flex-direction: column; gap: 0; }
.meta-row { display: flex; flex-direction: column; padding: 10px 0; border-bottom: 1px solid var(--border); }
.meta-row:last-child { border-bottom: none; padding-bottom: 0; }
.meta-row:first-child { padding-top: 0; }
.meta-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-tertiary); margin-bottom: 3px; }
.meta-val { font-size: 12px; color: var(--text-primary); word-break: break-all; display: flex; align-items: center; gap: 6px; }
.meta-val-mono { font-family: 'SF Mono', 'Monaco', monospace; font-size: 11px; color: var(--text-primary); }
.copy-btn { background: none; border: none; cursor: pointer; color: var(--text-tertiary); padding: 2px; border-radius: 4px; display: flex; align-items: center; transition: color .12s; flex-shrink: 0; }
.copy-btn:hover { color: var(--text-primary); }
.created-note { font-size: 11px; color: var(--text-tertiary); display: flex; align-items: flex-start; gap: 6px; margin-top: 12px; line-height: 1.4; }

/* MAIN CONTENT */
.content { display: flex; flex-direction: column; gap: 16px; }
@media (max-width: 900px) { .attempts-bar { position: static; } }
.section-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm); }
.section-head { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.section-title { font-size: 13px; font-weight: 600; color: var(--text-primary); }
.section-badge { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 20px; }
.sb-pass { background: #e6f5db; color: #3a7d1e; }
.sb-fail { background: #fde8e8; color: #c0392b; }
.sb-warn { background: #fbf1cf; color: #9a7400; }
.sb-skip { background: var(--surface-2); color: var(--text-tertiary); }
.section-body { padding: 20px; }

.check-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.check-item-label { font-size: 11px; font-weight: 500; color: var(--text-secondary); margin-bottom: 4px; }
.check-item-val { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; }
.check-dot { width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.cd-pass { background: #e6f5db; color: #3a7d1e; }
.cd-fail { background: #fde8e8; color: #c0392b; }
.cd-warn { background: #fbf1cf; color: #9a7400; }
.cd-skip { background: var(--surface-2); color: var(--text-tertiary); }
.check-text-pass { color: var(--valid); }
.check-text-fail { color: var(--invalid); }
.check-text-warn { color: var(--warn); }
.check-text-skip { color: var(--text-tertiary); }

.data-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.data-field-label { font-size: 11px; font-weight: 500; color: var(--text-tertiary); margin-bottom: 3px; }
.data-field-val { font-size: 13px; color: var(--text-primary); font-weight: 500; }
.data-field-val.empty { color: var(--text-tertiary); font-weight: 400; }
.expired-tag { font-size: 10px; font-weight: 600; background: #fde8e8; color: var(--invalid); padding: 1px 6px; border-radius: 10px; margin-left: 4px; }

.images-row { display: flex; gap: 12px; flex-wrap: wrap; }
.img-placeholder { width: 120px; height: 80px; border-radius: var(--radius-md); border: 1px dashed var(--border-md); background: var(--surface-2); display: flex; align-items: center; justify-content: center; }

/* WORKFLOW TIMELINE */
/* Not a card — a sticky strip in the page colour, so the chips read as a tab
   header over whichever attempt's sections are scrolling underneath. The
   negative margins cancel the column gap, so the strip's own padding is the
   only space around it and nothing shows through while scrolling. */
.attempts-bar { position: sticky; top: var(--sh-h); z-index: 20; background: var(--bg);
  display: flex; align-items: center; gap: 12px;
  padding: 12px 0 16px; margin: -12px 0 -16px; }
.attempts-bar[hidden] { display: none; }
.attempts-count { font-size: 11px; color: var(--text-tertiary); white-space: nowrap; margin-left: auto; }
.attempts-count b { color: var(--text-primary); font-weight: 600; }
.attempts-row { display: flex; gap: 8px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.attempts-row::-webkit-scrollbar { display: none; }
.att-chip { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; cursor: pointer;
  background: var(--surface); border: 1px solid var(--border-md); border-radius: var(--radius-md);
  padding: 8px 12px; font-family: var(--font); text-align: left; transition: border-color .15s, background .15s; }
.att-chip:hover { background: var(--surface-2); }
.att-chip.on { border-color: var(--text-primary); background: var(--surface-2); }
.att-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.att-body { display: flex; flex-direction: column; gap: 1px; }
.att-n { font-size: 12.5px; font-weight: 600; color: var(--text-primary); white-space: nowrap; }
.att-t { font-size: 11px; color: var(--text-tertiary); white-space: nowrap; }
.att-tag { font-size: 9.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
  color: var(--text-secondary); background: var(--surface-2); border-radius: 20px; padding: 2px 6px; }
.att-chip.on .att-tag { background: var(--surface); }
.tl-next { display: inline-flex; align-items: center; gap: 5px; margin-top: 6px; padding: 0;
  border: 0; background: none; cursor: pointer; font-family: var(--font); font-size: 11.5px;
  font-weight: 600; color: var(--blue); }
.tl-next:hover { text-decoration: underline; }
.tl-next svg { width: 11px; height: 11px; }
.timeline-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm); }
.timeline-head { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.timeline-title { font-size: 13px; font-weight: 600; color: var(--text-primary); }
.timeline-duration { font-size: 11px; color: var(--text-tertiary); display: flex; align-items: center; gap: 5px; white-space: nowrap; }
.timeline-body { padding: 8px 0; position: relative; }
/* One dashed rail behind the whole journey — the per-event stems read as
   separate lollipops rather than one continuous sequence. Its ends are set
   from the first and last dot in JS so it starts and stops on them. */
.timeline-body::before {
  content: ''; position: absolute; left: 35px; top: var(--tl-top, 19px); bottom: var(--tl-bottom, 19px);
  border-left: 2px dashed var(--border); pointer-events: none;
}
.tl-event { display: flex; align-items: flex-start; gap: 0; padding: 0 20px; position: relative; }
.tl-left { display: flex; flex-direction: column; align-items: center; width: 32px; flex-shrink: 0; padding-top: 14px; }
.tl-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; z-index: 1; }
.tl-dot-success   { background: var(--valid); box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px #e6f5db; }
.tl-dot-fail      { background: var(--invalid); box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px #fde8e8; }
.tl-dot-warn      { background: var(--warn); box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px #fbf1cf; }
.tl-dot-info      { background: var(--blue); box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px rgba(0,122,255,0.12); }
.tl-dot-neutral   { background: var(--text-tertiary); box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--surface-2); }
.tl-dot-abandoned { background: var(--invalid); box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px #fde8e8; }
.tl-right { flex: 1; min-width: 0; margin-left: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.tl-event:last-child .tl-right { border-bottom: none; }
.tl-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.tl-main { flex: 1; min-width: 0; }
.tl-label { font-size: 13px; font-weight: 500; color: var(--text-primary); }
.tl-sub { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
/* timestamp and the time that step took, stacked on the right — one column for
   time, one for outcome, and a step's duration no longer costs its own line */
.tl-meta { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.tl-time { font-size: 11px; color: var(--text-tertiary); white-space: nowrap; font-variant-numeric: tabular-nums; }

.tl-flags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.tl-flag { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 20px; }
.tf-slow    { background: #fbf1cf; color: #9a7400; }
.tf-abandon { background: #fde8e8; color: #c0392b; }
.tf-success { background: #e6f5db; color: #3a7d1e; }

.step-timing { margin-top: 20px; padding: 16px 20px; background: var(--surface); border-top: 1px solid var(--border); }
.step-timing-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.step-timing-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-tertiary); }
/* Most workflows are pre-created weeks ahead, so the wait before the customer
   starts says nothing about how long verifying took. This total counts only
   the capture steps and the processing that follows them. */
.step-timing-total { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-tertiary); white-space: nowrap; }
.step-timing-total span { font-weight: 600; color: var(--text-primary); }
.timing-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.timing-row:last-child { margin-bottom: 0; }
.timing-step { font-size: 12px; color: var(--text-secondary); width: 150px; flex-shrink: 0; }
.timing-bar-wrap { flex: 1; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
.timing-bar { height: 5px; border-radius: 3px; background: var(--blue); }
.timing-bar.slow { background: #e8a020; }
.timing-val { font-size: 12px; font-weight: 600; color: var(--text-primary); min-width: 48px; text-align: right;
  font-variant-numeric: tabular-nums; }

@media (max-width: 900px) { .detail-layout { grid-template-columns: 1fr; } .sidebar { position: static; } .check-grid { grid-template-columns: repeat(2,1fr); } .data-grid { grid-template-columns: repeat(2,1fr); } }
@media (max-width: 600px) { .check-grid, .data-grid { grid-template-columns: 1fr 1fr; } main { padding: 16px 12px 48px; } .timing-step { width: 110px; } }

/* ══ DARK MODE ═════════════════════════════════════════════════════════════
   Matches history.html and dashboard.html — the theme is set by the nav
   switcher and stored per user. Status pills keep their hue and swap the
   light tint for a low-alpha fill so they stay readable on near black. */
[data-theme="dark"] {
  --bg: #0a0a0b;
  --surface: #121214;
  --surface-2: #1c1c20;
  --border: rgba(255,255,255,0.09);
  --border-md: rgba(255,255,255,0.18);
  --text-primary: rgba(255,255,255,0.95);
  --text-secondary: rgba(255,255,255,0.56);
  --text-tertiary: rgba(255,255,255,0.38);
  --valid: #8CCB5C;
  --invalid: #F0756A;
  --expired: #E0A24E;
  --warn: #E7C457;
  --underage: #79ACE4;
  --incomplete: #C3B291;
  --blue: #5AA9FF;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.5);
  --shadow-md: 0 6px 18px rgba(0,0,0,0.55);
}
[data-theme="dark"] .vp-valid      { background: rgba(122,201,67,0.16); }
[data-theme="dark"] .vp-invalid    { background: rgba(228,78,78,0.17); }
[data-theme="dark"] .vp-expired    { background: rgba(214,138,44,0.16); }
[data-theme="dark"] .vp-underage   { background: rgba(70,135,214,0.18); }
[data-theme="dark"] .vp-incomplete { background: rgba(176,158,126,0.16); }
[data-theme="dark"] .sb-pass, [data-theme="dark"] .cd-pass, [data-theme="dark"] .tf-success { background: rgba(122,201,67,0.16); color: #AEE07C; }
[data-theme="dark"] .sb-fail, [data-theme="dark"] .cd-fail, [data-theme="dark"] .tf-abandon { background: rgba(228,78,78,0.17); color: #F09191; }
[data-theme="dark"] .sb-warn, [data-theme="dark"] .cd-warn, [data-theme="dark"] .tf-slow { background: rgba(228,176,36,0.16); color: #EBC55F; }
[data-theme="dark"] .expired-tag { background: rgba(228,78,78,0.17); }
[data-theme="dark"] .tl-dot-success   { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px rgba(122,201,67,0.18); }
[data-theme="dark"] .tl-dot-fail,
[data-theme="dark"] .tl-dot-abandoned { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px rgba(228,78,78,0.18); }
[data-theme="dark"] .tl-dot-warn      { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px rgba(228,176,36,0.18); }
[data-theme="dark"] .tl-dot-info      { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px rgba(90,169,255,0.2); }
[data-theme="dark"] .timing-bar.slow  { background: #E8A020; }
</style>
</head>
<body>

<header class="sh-nav" data-tab="history"></header>

<main>
  <a href="history.html" class="back-link">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 2L4 7l5 5"/></svg>
    Back to History
  </a>

  <div class="detail-layout">
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="sidebar-card" id="sidebarCard"><!-- JS --></div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="content">
      <!-- ATTEMPTS (only when the customer needed more than one) -->
      <div class="attempts-bar" id="attemptsCard" hidden>
        <div class="attempts-row" id="attemptsRow"></div>
        <div class="attempts-count" id="attemptsCount"></div>
      </div>

      <!-- IDV CHECKS -->
      <div class="section-card">
        <div class="section-head">
          <div class="section-title">IDV Checks</div>
          <span class="section-badge" id="idvBadge"></span>
        </div>
        <div class="section-body"><div class="check-grid" id="checkGrid"></div></div>
      </div>

      <!-- FRONT OCR DATA -->
      <div class="section-card">
        <div class="section-head"><div class="section-title">Front OCR Data</div></div>
        <div class="section-body"><div class="data-grid" id="ocrGrid"></div></div>
      </div>

      <!-- BARCODE DATA -->
      <div class="section-card">
        <div class="section-head"><div class="section-title">Barcode Data</div></div>
        <div class="section-body"><div class="data-grid" id="barcodeGrid"></div></div>
      </div>

      <!-- ID IMAGES -->
      <div class="section-card">
        <div class="section-head">
          <div class="section-title">ID Verification Images</div>
          <span style="font-size:11px;color:var(--text-tertiary)">3 images captured</span>
        </div>
        <div class="section-body">
          <div class="images-row">
            <div class="img-placeholder"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="12" cy="12" r="3"/></svg></div>
            <div class="img-placeholder"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18"/></svg></div>
            <div class="img-placeholder"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M6 15l3-3 3 3 3-4 3 4"/></svg></div>
          </div>
        </div>
      </div>

      <!-- WORKFLOW TIMELINE -->
      <div class="timeline-section">
        <div class="timeline-head">
          <div>
            <div class="timeline-title">Verification journey</div>
            <div style="font-size:11px;color:var(--text-tertiary);margin-top:2px">Step-by-step activity with timestamps</div>
          </div>
        </div>
        <div class="timeline-body" id="timelineBody"></div>
        <div class="step-timing">
          <div class="step-timing-head">
            <div class="step-timing-title">Time spent per step</div>
            <div class="step-timing-total" id="totalTime">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="6" cy="6" r="5"/><path d="M6 3.5V6l1.5 1.5"/></svg>
              <span></span>
            </div>
          </div>
          <div id="timingRows"></div>
        </div>
      </div>
    </div><!-- /content -->
  </div><!-- /detail-layout -->
</main>

<script>
/* ─── ICONS ─── */
const IC = {
  check:'<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2"><path d="M2.5 7.5l3 3 6-6.5"/></svg>',
  x:'<svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2"><path d="M2.5 2.5l9 9M11.5 2.5l-9 9"/></svg>',
  warn:'<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 1.5L13 12H1z"/><path d="M7 6v2.4M7 10.2v.1"/></svg>',
  dash:'<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2"><path d="M3.5 7h7"/></svg>'
};
const DOT = { pass:'<svg width="8" height="8" viewBox="0 0 8 8" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M1.5 4l2 2 3-3"/></svg>', fail:'<svg width="7" height="7" viewBox="0 0 7 7" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M1 1l5 5M6 1L1 6"/></svg>', warn:'<svg width="8" height="8" viewBox="0 0 8 8" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 2v2.6M4 6.2v.1"/></svg>', skip:'<svg width="8" height="8" viewBox="0 0 8 8" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 4h4"/></svg>' };
const COPY = '<svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="4" y="4" width="8" height="8" rx="1.5"/><path d="M9 4V2.5A1.5 1.5 0 007.5 1h-5A1.5 1.5 0 001 2.5v5A1.5 1.5 0 002.5 9H4"/></svg>';

/* ─── RESULT ARCHETYPES ─── */
const ARCH = {
  Valid:      { j:'valid',      pill:{cls:'vp-valid',ic:'check',label:'Valid'},                 badge:{cls:'sb-pass',text:'All passed'},
                checks:[['Scan Front','pass','Passed'],['Scan Back','pass','Passed'],['ID Number Verification','pass','Verified'],['ID Front Back Match','pass','Matched'],['Face Match','pass','Matched'],['Barcode Detective','pass','Passed']] },
  Invalid:    { j:'fail',       pill:{cls:'vp-invalid',ic:'x',label:'Invalid'},                 badge:{cls:'sb-fail',text:'2 failed'}, stepFail:'ID mismatch',
                checks:[['Scan Front','pass','Passed'],['Scan Back','pass','Passed'],['ID Number Verification','fail','Failed'],['ID Front Back Match','fail','Mismatch'],['Face Match','pass','Matched'],['Barcode Detective','pass','Passed']],
                failStep:'Scan ID back', failMsg:'ID number could not be verified against issuing records', verdictColor:'--invalid' },
  Expired:    { j:'fail',       pill:{cls:'vp-expired',ic:'x',label:'Expired'},                 badge:{cls:'sb-fail',text:'1 failed'}, stepFail:'Expired ID',
                checks:[['Scan Front','pass','Passed'],['Scan Back','fail','Expired ID'],['ID Number Verification','skip','Skipped'],['ID Front Back Match','pass','Matched'],['Face Match','pass','Matched'],['Barcode Detective','skip','Skipped']],
                failStep:'Scan ID back', failMsg:'Expiry date detected as past — the ID has expired', verdictColor:'--expired', expired:true },
  Underage:   { j:'underage',   pill:{cls:'vp-underage',ic:'warn',label:'Underage'},            badge:{cls:'sb-warn',text:'Underage'},
                checks:[['Scan Front','pass','Passed'],['Scan Back','pass','Passed'],['ID Number Verification','pass','Verified'],['ID Front Back Match','pass','Matched'],['Face Match','pass','Matched'],['Barcode Detective','pass','Passed']],
                failMsg:'Date of birth indicates the holder is under 21', verdictColor:'--underage', underage:true },
  Incomplete: { j:'incomplete', pill:{cls:'vp-incomplete',ic:'dash',label:'Incomplete'},        badge:{cls:'sb-skip',text:'Abandoned'},
                checks:[['Scan Front','pass','Passed'],['Scan Back','skip','Not reached'],['ID Number Verification','skip','Not reached'],['ID Front Back Match','skip','Not reached'],['Face Match','pass','Passed'],['Barcode Detective','skip','Not reached']],
                abandonStep:'Scan ID front' }
};

const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MON_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function ampm(d){ let h=d.getHours(); const ap=h<12?'AM':'PM'; h=h%12||12; return {h,ap,m:String(d.getMinutes()).padStart(2,'0'),s:String(d.getSeconds()).padStart(2,'0')}; }
function fmtDT(d){ const t=ampm(d); return MON[d.getMonth()]+' '+d.getDate()+' · '+t.h+':'+t.m+':'+t.s+' '+t.ap; }
function fmtScanned(d){ const t=ampm(d); return MON_FULL[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear()+' · '+t.h+':'+t.m+' '+t.ap; }

/* ─── LOAD RECORD ─── */
function loadRecord(){
  let r;
  try { r = JSON.parse(sessionStorage.getItem('vyyerDetailRecord')); } catch(e){ r = null; }
  if(!r) r = { id:'VYR-8K2QX', name:'Steven Elkins', email:'steven.elkins@icloud.com', result:'Expired', workflow:'ID Verification', platformLabel:'iOS', version:'v1.8.12/362', profile:'Default profile', ts:'2026-06-03T05:37:02' };
  r.ts = new Date(r.ts);
  return r;
}
function initials(n){ const p=n.split(/\s+/); return ((p[0][0]||'')+(p[p.length-1][0]||'')).toUpperCase(); }
function avatarColors(n){ let h=0; for(const c of n) h=(h*31+c.charCodeAt(0))%360; return {bg:`hsl(${h} 52% 91%)`, fg:`hsl(${h} 42% 34%)`}; }
function domainFor(r){ return r.platformLabel==='Web SDK' ? 'checkout.merchant.com' : 'id.vyyer'; }

const REC = loadRecord();

/* ─── ATTEMPTS ───────────────────────────────────────────────────────────────
   A customer may retry up to the merchant's limit. The record's result is the
   verdict of the LAST attempt, so that one is listed first; the earlier ones
   are the failures that sent them round again. Most records have a single
   attempt and show no switcher at all. */
const MAX_ATTEMPTS = REC.maxAttempts || 5;
const RETRY_RESULTS = ['Incomplete','Invalid'];
function seeded(str){ let h=2166136261>>>0;
  for(const c of String(str)) h=Math.imul(h ^ c.charCodeAt(0), 16777619)>>>0;
  return ()=>{ h=(Math.imul(h,1103515245)+12345)>>>0; return h/4294967296; }; }
const ATTEMPTS = (function(){
  const n = Math.max(1, Math.min(MAX_ATTEMPTS, REC.attempts || 1));
  const rnd = seeded(REC.id + '|' + n);
  const out = []; let t = REC.ts.getTime(), prev = REC.result;
  for(let k = n; k >= 1; k--){
    const latest = k === n;
    /* earlier tries don't repeat back to back — a run of identical verdicts
       reads as a bug rather than as a customer struggling */
    let result = REC.result;
    if(!latest){
      do { result = RETRY_RESULTS[Math.floor(rnd()*RETRY_RESULTS.length)]; } while(result === prev);
      prev = result;
    }
    out.push({ n:k, latest, result, arch: ARCH[result] || ARCH.Valid, ts: new Date(t), seed: rnd() });
    t -= (3 + Math.floor(rnd()*12)) * 60000;      /* a few minutes between tries */
  }
  return out;                                     /* already most-recent-first */
})();
let ATT = ATTEMPTS[0];
let A = ATT.arch;

      <div class="meta-row"><div class="meta-label">Customer UID</div><div class="meta-val"><span class="meta-val-mono">eTR5DBMb0cfy…M325s=</span><button class="copy-btn" data-copy="eTR5DBMb0cfyM325s=" title="Copy">${COPY}</button></div></div>
      <div class="meta-row"><div class="meta-label">Workflow</div><div class="meta-val">${REC.workflow}</div></div>
      <div class="meta-row"><div class="meta-label">Domain</div><div class="meta-val">${domainFor(REC)}</div></div>
      <div class="meta-row"><div class="meta-label">Platform</div><div class="meta-val">${REC.platformLabel} · ${REC.version||''}</div></div>
      <div class="meta-row"><div class="meta-label">Profile</div><div class="meta-val">${REC.profile}</div></div>
      <div class="meta-row"><div class="meta-label">Scanned</div><div class="meta-val">${fmtScanned(ATT.ts)}</div></div>
    </div>
    <div class="created-note">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.3" style="flex-shrink:0;margin-top:1px"><circle cx="6.5" cy="6.5" r="5.5"/><path d="M6.5 5v3M6.5 9.5v.2"/></svg>
      Workflow pre-created ${fmtScanned(created)}

/* ─── TIMELINE ─── */
function renderTimeline(){
  const end = ATT.ts.getTime();
  const at = s => fmtDT(new Date(end - s*1000));
  const vc = A.verdictColor ? `var(${A.verdictColor})` : 'var(--valid)';
  const ev = [];
  ev.push({ t:at(262), dot:'neutral', label:'Workflow created', sub:'Verification session initialized · '+domainFor(REC) });
  ev.push({ t:at(170), dot:'info', label:'Link opened', sub:'User opened the verification widget · 1m 32s after it was created' });
  const jitter = Math.round(ATT.seed*14) - 7;           /* same attempt, same numbers */
  ev.push({ t:at(154), dot:'info', label:'Started verification', sub:'User tapped “Start verification” · ' + (16+Math.max(-9,jitter)) + 's on the start screen' });

  ev.push({ t:at(118), dot:'success', label:'Scan face', sub:'Liveness check passed · Face captured', secs:36, flag:['tf-success','✓ Passed'] });

  if(A.j==='incomplete'){
    ev.push({ t:at(0), dot:'abandoned', label:'Scan ID front', sub:'User exited the widget before capturing their ID', dur:'Last activity', flag:['tf-abandon','✗ Abandoned'] });
    finish(ev); return;
  }

  /* the step still passed — being slow is a timing note, not the outcome */
  ev.push({ t:at(60), dot:'success', label:'Scan ID front', sub:'Front of ID captured · OCR successful', secs:58, flag:['tf-success','✓ Passed'] });

  if(A.j==='fail'){
    ev.push({ t:at(4), dot:'fail', label:'Scan ID back', sub:'Back of ID captured · '+A.failMsg, secs:56, flag:['tf-abandon','✗ '+(A.stepFail||A.pill.label)] });
    ev.push({ t:at(0), dot:'fail', label:'Verdict issued', sub:`Final result: <strong style="color:${vc}">${A.pill.label}</strong> · ${A.stepFail||A.failMsg}`, secs:4, step:'Processing' });
  } else if(A.j==='underage'){
    ev.push({ t:at(4), dot:'success', label:'Scan ID back', sub:'Back of ID captured · Barcode read', secs:56, flag:['tf-success','✓ Passed'] });
    ev.push({ t:at(0), dot:'warn', label:'Verdict issued', sub:`Final result: <strong style="color:${vc}">Underage</strong> · ${A.failMsg}`, secs:4, step:'Processing' });
  } else {
    ev.push({ t:at(4), dot:'success', label:'Scan ID back', sub:'Back of ID captured · Barcode read', secs:56, flag:['tf-success','✓ Passed'] });
    ev.push({ t:at(0), dot:'success', label:'Verdict issued', sub:`Final result: <strong style="color:${vc}">Valid</strong> · All checks passed`, secs:4, step:'Processing' });
  }
  finish(ev);

  function finish(events){
    /* An earlier attempt ends where the customer went round again. */
    if(!ATT.latest){
      events = events.concat([{ t:at(-42), dot:'info', label:'Retry clicked',
        sub:'Customer started attempt ' + (ATT.n + 1), next:true }]);
    }
    /* exactly one step gets the slow chip — the slowest, and only if it is
       actually slow. The chip carries the time, so nothing repeats it. */
    const slowest = events.reduce((n,e)=>Math.max(n, e.secs||0), 0);
    const slowIdx = slowest>=45 ? events.findIndex(e=>e.secs===slowest) : -1;
    document.getElementById('timelineBody').innerHTML = events.map((e,i)=>{
      const slow = i===slowIdx;
      /* Times live in one place now — the section below. The only timing worth
         calling out inline is a step that dragged, and it sits with the verdict
         rather than in a second column of small grey numbers. */
      const slowFlag = slow ? `<span class="tl-flag tf-slow">⚠ Slow — ${e.secs}s</span>` : '';
      return `
      <div class="tl-event">
        <div class="tl-left"><div class="tl-dot tl-dot-${e.dot}"></div></div>
        <div class="tl-right">
          <div class="tl-row">
            <div class="tl-main">
              <div class="tl-label">${e.label}</div>
              ${e.sub?`<div class="tl-sub">${e.sub}</div>`:''}
              ${(e.flag||slowFlag)?`<div class="tl-flags">${e.flag?`<span class="tl-flag ${e.flag[0]}">${e.flag[1]}</span>`:''}${slowFlag}</div>`:''}
              ${e.next?`<button class="tl-next" onclick="goNextAttempt()">Go to attempt ${ATT.n+1}
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M12 5l7 7-7 7"/></svg></button>`:''}
            </div>
            <div class="tl-meta"><div class="tl-time">${e.t}</div></div>
          </div>
        </div>
      </div>`;}).join('');
    /* the rail runs from the first dot to the last, so measure them */
    const body=document.getElementById('timelineBody');
    const dots=[...body.querySelectorAll('.tl-dot')];
    if(dots.length){
      const b=body.getBoundingClientRect();
      const f=dots[0].getBoundingClientRect(), l=dots[dots.length-1].getBoundingClientRect();
      body.style.setProperty('--tl-top', Math.round(f.top-b.top+f.height/2)+'px');
      body.style.setProperty('--tl-bottom', Math.round(b.bottom-l.bottom+l.height/2)+'px');
    }
    renderTimings(events);
  }
}

/* the bars under the journey are the same durations, read off the events */
const fmtDur = s => s>=60 ? Math.floor(s/60)+'m '+String(s%60).padStart(2,'0')+'s' : s+'s';
function renderTimings(events){
  const steps=[];
  events.forEach(e=>{ if(e.secs!=null) steps.push([e.step || e.label, e.secs]); });
  /* a full bar is the whole time spent, so each bar is that step's share of it
     — the old max-relative scaling made the slowest step look like 100% */
  const total=steps.reduce((n,[,v])=>n+v,0) || 1;
  const max=steps.reduce((n,[,v])=>Math.max(n,v),1);
  /* only the one slowest step is flagged — two amber bars reads as a pattern
     rather than as the step that held things up */
  const slow = max>=45 ? steps.findIndex(([,v])=>v===max) : -1;
  document.getElementById('timingRows').innerHTML = steps.map(([label,v],i)=>`
    <div class="timing-row"><div class="timing-step">${label}</div>
      <div class="timing-bar-wrap"><div class="timing-bar${i===slow?' slow':''}" style="width:${(v/total*100).toFixed(1)}%"></div></div>
      <div class="timing-val">${v}s</div></div>`).join('');
  const tt=document.getElementById('totalTime');
  tt.style.display = steps.length ? '' : 'none';
  tt.querySelector('span').textContent = 'Total time to verify: ' + fmtDur(total);
}

/* ─── ATTEMPT SWITCHER ─── */
const ATT_DOT = { Valid:'--valid', Invalid:'--invalid', Expired:'--expired',
                  Underage:'--underage', Incomplete:'--incomplete' };
function renderAttempts(){
  const card=document.getElementById('attemptsCard');
  if(ATTEMPTS.length<2){ card.hidden=true; return; }
  card.hidden=false;
  document.getElementById('attemptsCount').innerHTML =
    `<b>${ATTEMPTS.length}</b> of ${MAX_ATTEMPTS} allowed`;
  document.getElementById('attemptsRow').innerHTML = ATTEMPTS.map((a,i)=>{
    const t=ampm(a.ts);
    return `<button class="att-chip${a===ATT?' on':''}" data-i="${i}">
      <span class="att-dot" style="background:var(${ATT_DOT[a.result]||'--text-tertiary'})"></span>
      <span class="att-body"><span class="att-n">Attempt ${a.n}</span>
        <span class="att-t">${a.result} · ${t.h}:${t.m} ${t.ap}</span></span>
      ${a.latest?'<span class="att-tag">Latest</span>':''}</button>`;
  }).join('');
  document.getElementById('attemptsRow').onclick = e=>{
    const b=e.target.closest('.att-chip'); if(!b) return;
    selectAttempt(ATTEMPTS[+b.dataset.i]);
  };
}
/* the list runs most-recent-first, so the next attempt sits one above */
function goNextAttempt(){
  const i = ATTEMPTS.indexOf(ATT);
  if(i > 0) selectAttempt(ATTEMPTS[i-1]);
}
function selectAttempt(a){
  ATT=a; A=a.arch;
  renderAttempts(); renderSidebar(); renderChecks(); renderData(); renderTimeline();
}

/* ─── COPY BUTTONS ─── */
function wireCopy(btn){
  btn.addEventListener('click', () => {
    navigator.clipboard?.writeText(btn.dataset.copy || '').catch(()=>{});
    const orig = btn.innerHTML;
    btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="#3a7d1e" stroke-width="1.6"><path d="M2 7l3 3 6-6"/></svg>';
    setTimeout(() => btn.innerHTML = orig, 1500);
  });
}

/* ─── BOOT ─── */
renderAttempts(); renderSidebar(); renderChecks(); renderData(); renderTimeline();
</script>
